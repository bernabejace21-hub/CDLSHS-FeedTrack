<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CDLSHS FeedTrack — SBFP Monitoring</title>
<meta name="description" content="CDLSHS FeedTrack — School Based Feeding Program (SBFP) attendance, student records, biweekly progress and Excel reporting.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
/* =========================================================
   CDLSHS FeedTrack — design tokens
   Green is the programme accent (school feeding program).
   --app-bg / --side-bg are user-customizable in Settings.
   ========================================================= */
:root{
  --primary:#15803D; --primary-strong:#166534; --primary-soft:#F0FDF4; --primary-line:#BBF7D0;
  --accent:#0EA5E9;
  --chart-blue:#2563EB; --chart-orange:#EA580C;
  --ok:#15803D; --ok-soft:#F0FDF4; --warn:#C2410C; --warn-soft:#FFF7ED;
  --danger:#DC2626; --danger-soft:#FEF2F2;
  --info:#2563EB; --info-soft:#EFF6FF;
  --gold:#B45309; --gold-soft:#FFF7ED;

  --bg:#F4F7F4; --surface:#FFFFFF; --surface-2:#F7FAF7; --shell:rgba(255,255,255,.82);
  --text:#12201A; --text-2:#3D4E45; --text-3:#5A6B62;
  --border:#E2E9E3; --border-strong:#CBD6CD;
  --input-bg:#FFFFFF;

  /* user-customizable backgrounds */
  --app-bg:#F4F7F4;
  --side-bg:#FFFFFF;
  --side-text:#26362D;

  --shadow-sm:0 1px 2px rgba(18,32,26,.05);
  --shadow:0 1px 3px rgba(18,32,26,.06), 0 10px 26px -18px rgba(18,32,26,.35);
  --shadow-lg:0 18px 48px -24px rgba(18,32,26,.45);
  --radius:14px; --radius-sm:10px; --radius-lg:20px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-display:'Fraunces','Inter',serif;
  --side-w:264px;
  --bg-img:none; --bg-opacity:.14;
}
body.dark{
  --primary:#4ADE80; --primary-strong:#22C55E; --primary-soft:#062E1B; --primary-line:#14532D;
  --ok:#4ADE80; --ok-soft:#052e1c; --warn:#FDBA74; --warn-soft:#3b2306;
  --danger:#F87171; --danger-soft:#3d1414; --info:#60A5FA; --info-soft:#0d2547;
  --gold:#FCD34D; --gold-soft:#3a2a08;
  --bg:#0A110D; --surface:#111A14; --surface-2:#16211A; --shell:rgba(10,17,13,.82);
  --text:#E7F0EA; --text-2:#A6BCAF; --text-3:#82998B;
  --side-text:#A6BCAF;
  --border:#213027; --border-strong:#2F4136;
  --input-bg:#0D1610;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 3px rgba(0,0,0,.4), 0 12px 28px -20px rgba(0,0,0,.9);
  --shadow-lg:0 20px 50px -24px rgba(0,0,0,.9);
}

/* =========================================================
   base
   ========================================================= */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--font);color:var(--text);background:var(--app-bg);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;transition:background .2s,color .2s;min-height:100vh;}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--text);margin:0;letter-spacing:-.01em;font-weight:600;}
p{margin:0;}
button{font-family:inherit;cursor:pointer;color:inherit;background:none;border:none;font-size:inherit;}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);}
a{color:var(--primary);}
img{max-width:100%;}
.hidden{display:none !important;}
/* visible keyboard focus everywhere (accessibility) */
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,
textarea:focus-visible,[tabindex]:focus-visible{outline:2.5px solid var(--primary);outline-offset:2px;border-radius:6px;}
.ico{width:18px;height:18px;flex:0 0 auto;} /* default icon size; context rules override */
#root{min-height:100vh;position:relative;z-index:1;}
#toastWrap{position:fixed;right:16px;bottom:16px;z-index:9000;display:flex;flex-direction:column;gap:10px;max-width:min(380px,calc(100vw - 32px));}
#confettiLayer{position:fixed;inset:0;pointer-events:none;z-index:9500;overflow:hidden;}
#confettiLayer i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;opacity:.98;
  animation:confFall linear forwards;}
@keyframes confFall{to{transform:translate3d(var(--dx),105vh,0) rotate(var(--rot));opacity:.85}}
:focus-visible{outline:2.5px solid var(--primary);outline-offset:2px;border-radius:6px;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* background artwork = the official CDLSHS logo (contain → never stretched) */
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:var(--bg-img);
  background-size:cover;background-position:center;opacity:var(--bg-opacity);}
body.bg-logo::before{top:50%;left:50%;width:min(88vmin,780px);height:min(88vmin,780px);
  transform:translate(-50%,-50%);border-radius:28px;
  background-repeat:no-repeat;background-position:center;background-size:contain;}

/* =========================================================
   buttons / badges / pills
   ========================================================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:var(--radius-sm);
  font-weight:600;font-size:13.5px;border:1px solid transparent;background:var(--surface);color:var(--text);
  border-color:var(--border);transition:all .16s;box-shadow:var(--shadow-sm);white-space:nowrap;}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow);}
.btn:active{transform:translateY(0);}
.btn .ico{width:16px;height:16px;}
.btn-primary{background:var(--primary);color:#fff;border-color:transparent;}
body.dark .btn-primary{color:#04140B;}
.btn-primary:hover{background:var(--primary-strong);}
.btn-secondary{background:var(--surface);}
.btn-soft{background:var(--primary-soft);color:var(--primary);border-color:var(--primary-line);}
.btn-danger{background:var(--danger);color:#fff;border-color:transparent;}
.btn-ghost{background:transparent;border-color:transparent;box-shadow:none;}
.btn-ghost:hover{background:var(--surface-2);box-shadow:none;transform:none;}
.btn-block{width:100%;}
.btn-lg{padding:12px 18px;font-size:15px;}
.btn-sm{padding:6px 11px;font-size:12.5px;}
.btn-icon{padding:8px;border-radius:var(--radius-sm);}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none;}
.btn.is-loading{position:relative;color:transparent;}
.btn.is-loading::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;
  border:2px solid rgba(255,255,255,.45);border-top-color:#fff;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;
  background:var(--surface-2);color:var(--text-2);border:1px solid var(--border);white-space:nowrap;}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent;}
.badge.bad{background:var(--danger-soft);color:var(--danger);border-color:transparent;}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent;}
.badge.info{background:var(--info-soft);color:var(--info);border-color:transparent;}
.badge.muted{background:var(--surface-2);color:var(--text-3);}
.badge.demo{background:var(--warn-soft);color:var(--warn);}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;display:inline-block;}
.dot.ok{background:var(--ok);} .dot.muted{background:var(--border-strong);} .dot.warn{background:var(--warn);}

.seg{display:inline-flex;gap:3px;padding:3px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);flex-wrap:wrap;}
.seg button{padding:6px 13px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--text-2);transition:all .15s;}
.seg button.on{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-sm);}
.seg.wrap{flex-wrap:wrap;}

/* =========================================================
   forms
   ========================================================= */
.field{display:flex;flex-direction:column;gap:5px;position:relative;}
.field>label{font-size:12px;font-weight:700;color:var(--text-2);letter-spacing:.01em;}
.field .req{color:var(--danger);}
.inp{width:100%;padding:9px 12px;border-radius:var(--radius-sm);border:1.5px solid var(--border);
  background:var(--input-bg);transition:border-color .15s,box-shadow .15s;}
.inp:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
.inp.invalid{border-color:var(--danger);}
select.inp{cursor:pointer;}
textarea.inp{resize:vertical;min-height:70px;}
.pw-toggle{position:absolute;right:8px;top:26px;font-size:10.5px;font-weight:800;color:var(--text-3);
  padding:3px 6px;border-radius:6px;letter-spacing:.04em;}
.pw-toggle:hover{color:var(--primary);background:var(--primary-soft);}
.hint{font-size:12.5px;color:var(--text-3);}
.err-msg{font-size:12.5px;color:var(--danger);font-weight:600;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;}

/* =========================================================
   panels / cards
   ========================================================= */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.panel-head h2,.panel-head h3{font-size:15.5px;}
.panel-head .sub{font-size:12.5px;color:var(--text-3);font-family:var(--font);}
.panel-body{padding:18px;}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap;}
.page-head h1{font-size:26px;}
.page-head .sub{color:var(--text-3);font-size:13px;margin-top:3px;}
.page-head .acts{display:flex;gap:9px;flex-wrap:wrap;}

.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden;}
.kpi .lab{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);}
.kpi .num{font-size:30px;font-weight:800;line-height:1.1;font-family:var(--font-display);}
.kpi .note{font-size:12px;color:var(--text-3);}
.kpi .ico-wrap{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  background:var(--primary-soft);color:var(--primary);}
.kpi .ico-wrap .ico{width:17px;height:17px;}
.kpi.tone-ok .num{color:var(--ok);} .kpi.tone-warn .num{color:var(--warn);} .kpi.tone-info .num{color:var(--info);}
.kpi.tone-danger .num{color:var(--danger);}

.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:52px 20px;text-align:center;color:var(--text-3);}
.empty .ico{width:44px;height:44px;stroke-width:1.4;color:var(--border-strong);}
.empty h3{font-size:17px;color:var(--text-2);}
.empty p{max-width:420px;font-size:13.5px;}

/* =========================================================
   app shell: top bar + slide-in menu drawer (☰)
   The hamburger opens/closes the drawer; the drawer
   background is user-customizable via --side-bg.
   ========================================================= */
.app{min-height:100vh;}
.main{min-width:0;display:flex;flex-direction:column;background:var(--app-bg);}
.topbar{display:flex;align-items:center;gap:7px;padding:8px 16px;background:var(--shell);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;flex-wrap:wrap;}
.tb-item{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;font-weight:700;
  font-size:13px;color:var(--text-2);border:1px solid transparent;transition:all .15s;letter-spacing:.02em;}
.tb-item:hover{background:var(--primary-soft);color:var(--primary);}
.tb-item.active{background:var(--primary-soft);color:var(--primary);border-color:var(--primary-line);}
.tb-item .ico{width:17px;height:17px;flex:0 0 auto;}
/* ☰ sits alone on the far right of the top bar, separate from Home/QR/Grade */
.tb-menu{margin-left:auto;border-color:var(--border);background:var(--surface);}
.tb-menu:hover{border-color:var(--primary-line);}

.searchstrip{display:flex;gap:8px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--surface);}
.searchstrip .sfield{max-width:520px;position:relative;}
.sfield{flex:1;display:flex;align-items:center;gap:8px;padding:0 12px;height:38px;border-radius:10px;
  border:1.5px solid var(--border);background:var(--surface);}
.sfield .ico{width:16px;height:16px;color:var(--text-3);flex:0 0 auto;}
.sfield input{flex:1;border:none;background:none;outline:none;height:100%;}

/* navigation drawer slides in from the RIGHT edge */
.side{position:fixed;right:0;top:0;bottom:0;width:var(--side-w);background:var(--side-bg);color:var(--side-text);
  border-left:1px solid var(--border);display:flex;flex-direction:column;z-index:70;
  transform:translateX(100%);visibility:hidden;
  transition:transform .22s ease,visibility 0s linear .22s;
  box-shadow:var(--shadow-lg);overflow:hidden auto;}
.app.drawer-open .side{transform:none;visibility:visible;transition:transform .22s ease;}
.side-brand{display:flex;align-items:center;gap:10px;padding:15px 16px;border-bottom:1px solid var(--border);flex:0 0 auto;}
.side-brand img{width:38px;height:38px;border-radius:9px;object-fit:cover;flex:0 0 auto;background:var(--surface-2);}
.side-brand .bt{display:flex;flex-direction:column;line-height:1.15;min-width:0;}
.side-brand .bt b{font-family:var(--font-display);font-size:16.5px;color:var(--text);letter-spacing:-.02em;}
.side-brand .bt span{font-size:11px;font-weight:600;color:var(--primary);letter-spacing:.04em;text-transform:uppercase;}
.side-nav{padding:10px 10px 24px;display:flex;flex-direction:column;gap:2px;}
.glabel{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);padding:14px 10px 6px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:13.5px;font-weight:600;
  color:var(--side-text);opacity:.86;width:100%;text-align:left;transition:all .14s;border:1px solid transparent;}
.nav-item:hover{background:var(--primary-soft);opacity:1;color:var(--primary);}
.nav-item.on{background:var(--primary-soft);color:var(--primary);opacity:1;border-color:var(--primary-line);font-weight:700;}
.nav-item .ico{width:18px;height:18px;flex:0 0 auto;}
.nav-count{margin-left:auto;font-size:11px;font-weight:700;color:var(--text-3);background:var(--surface-2);
  border:1px solid var(--border);border-radius:999px;padding:1px 7px;}
.nav-item.on .nav-count{background:var(--surface);color:var(--primary);}
.side-foot{margin-top:auto;padding:12px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-3);}
.side-scrim{position:fixed;inset:0;background:rgba(12,22,16,.45);z-index:65;opacity:0;visibility:hidden;
  transition:opacity .2s ease,visibility 0s linear .2s;pointer-events:none;}
.side-scrim.on{opacity:1;visibility:visible;transition:opacity .2s ease;pointer-events:auto;}
.content{padding:20px;flex:1;max-width:1320px;width:100%;}

/* landing screen (no grade/section selected) */
.landing{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  min-height:calc(100vh - 150px);text-align:center;padding:40px 20px;}
.landing .logo-box{width:190px;height:190px;border-radius:26px;background:var(--surface);border:1px solid var(--border);
  box-shadow:var(--shadow-lg);display:grid;place-items:center;padding:16px;overflow:hidden;}
.landing .logo-box img{width:100%;height:100%;object-fit:contain;}
.landing h1{font-size:30px;}
.landing .tag{color:var(--text-2);font-size:14.5px;max-width:560px;}
.landing .quick{display:flex;gap:11px;flex-wrap:wrap;justify-content:center;margin-top:6px;}

/* =========================================================
   section tiles
   ========================================================= */
.sect-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:13px;}
.sect-tile{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:15px;box-shadow:var(--shadow-sm);cursor:pointer;transition:all .16s;text-align:left;width:100%;}
.sect-tile:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--primary-line);}
.sect-tile.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
.sect-tile .head{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14.5px;margin-bottom:8px;}
.sect-tile .n{display:block;font-size:12.5px;color:var(--text-3);}
.sect-tile .adv{display:block;font-size:12.5px;color:var(--text-2);margin-top:2px;}
.sect-tile .ico-wrap{width:34px;height:34px;border-radius:10px;background:var(--primary-soft);color:var(--primary);
  display:grid;place-items:center;margin-bottom:10px;}
.sect-tile .ico-wrap .ico{width:18px;height:18px;}
.tile-x{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;
  color:var(--text-3);font-size:13px;}
.tile-x:hover{background:var(--danger-soft);color:var(--danger);}
.crumb{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-3);margin-bottom:12px;flex-wrap:wrap;}
.crumb button{color:var(--primary);font-weight:600;}
.summary-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 16px;margin-bottom:14px;box-shadow:var(--shadow-sm);}
.summary-bar h1{font-size:22px;}
.sb-stats{display:flex;gap:20px;flex-wrap:wrap;}
.sb-stats div{display:flex;flex-direction:column;line-height:1.2;}
.sb-stats b{font-size:19px;font-family:var(--font-display);}
.sb-stats span{font-size:11.5px;color:var(--text-3);font-weight:600;}

/* =========================================================
   tables + roster
   ========================================================= */
.tbl-wrap{overflow:auto;border-radius:var(--radius);}
table.data{width:100%;border-collapse:collapse;font-size:13px;}
table.data th{text-align:left;padding:10px 12px;background:var(--surface-2);color:var(--text-2);font-size:11px;
  font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:1;}
table.data td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
table.data tbody tr:hover{background:var(--surface-2);}
table.data tbody tr:last-child td{border-bottom:none;}
table.data .missing{color:var(--text-3);font-style:italic;}
table.data td.num{text-align:right;font-variant-numeric:tabular-nums;}
.mono{font-family:ui-monospace,'Cascadia Mono',Menlo,monospace;font-size:12.5px;}

.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px;}
.roster-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;
  box-shadow:var(--shadow-sm);cursor:pointer;transition:all .16s;display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;}
.roster-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--primary-line);}
.avatar{width:52px;height:52px;border-radius:12px;flex:0 0 auto;overflow:hidden;background:var(--primary-soft);
  display:grid;place-items:center;color:var(--primary);font-weight:800;font-size:17px;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.avatar.lg{width:74px;height:74px;border-radius:14px;font-size:24px;}
.rc-body{min-width:0;flex:1;}
.rc-name{font-weight:700;font-size:14px;line-height:1.25;}
.rc-meta{font-size:11.5px;color:var(--text-3);margin-top:2px;}
.rc-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;}
.rc-actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
.mini-btn{padding:4px 9px;border-radius:7px;font-size:11.5px;font-weight:700;border:1px solid var(--border);
  background:var(--surface);color:var(--text-2);}
.mini-btn:hover{background:var(--primary-soft);color:var(--primary);border-color:var(--primary-line);}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.toolbar .inp{width:auto;min-width:150px;}

/* =========================================================
   streak (flame)
   ========================================================= */
.streak{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:13px;padding:3px 9px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);}
.streak .flame{width:15px;height:15px;flex:0 0 auto;}
.streak.locked{color:var(--text-3);}
.streak.locked .flame{color:var(--border-strong);filter:grayscale(1);opacity:.75;}
.streak.unlocked{background:var(--gold-soft);color:var(--gold);border-color:transparent;}
.streak.unlocked .flame{color:#F59E0B;animation:flick 1.25s ease-in-out infinite;transform-origin:50% 85%;}
@keyframes flick{0%,100%{transform:scale(1) rotate(-1deg)}50%{transform:scale(1.13) rotate(2deg)}}
.streak-lg{font-size:26px;padding:9px 16px;gap:9px;border-radius:14px;}
.streak-lg .flame{width:30px;height:30px;}
.streak-lg .lbl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.8;}
.streak-progress{height:7px;border-radius:99px;background:var(--border);overflow:hidden;margin-top:7px;}
.streak-progress i{display:block;height:100%;background:linear-gradient(90deg,#F59E0B,#F97316);border-radius:99px;transition:width .5s;}

/* =========================================================
   calendar
   ========================================================= */
.cal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 15px;border-bottom:1px solid var(--border);}
.cal-head h3{font-size:16px;text-transform:uppercase;letter-spacing:.03em;}
.cal-nav{display:flex;gap:5px;align-items:center;}
.cal-nav button:not(.btn){width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;}
.cal-nav button:not(.btn):hover{background:var(--primary-soft);color:var(--primary);border-color:var(--primary-line);}
.cal-nav .ico{width:15px;height:15px;}
/* month title in the calendar header = tappable pill that opens the picker */
.cal-head .ym-title{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);
  font-size:16.5px;font-weight:700;background:var(--surface);border:1px solid var(--primary-line);
  border-radius:999px;padding:6px 15px;cursor:pointer;color:var(--primary);
  box-shadow:var(--shadow-sm);transition:background .16s ease,transform .14s ease,box-shadow .18s ease;}
.cal-head .ym-title:hover{background:var(--primary-soft);transform:translateY(-1px);box-shadow:var(--shadow);}
.cal-head .ym-title:active{transform:translateY(0);}
.cal-head .ym-title .ico{width:15px;height:15px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:12px 15px 15px;}
.cal-dow{text-align:center;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--text-3);padding-bottom:3px;}
.cal-day{position:relative;aspect-ratio:1/.92;border-radius:11px;border:1.5px solid var(--border);background:var(--surface-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:all .14s;padding:2px;}
.cal-day:hover:not(:disabled){border-color:var(--primary);background:var(--primary-soft);}
.cal-day .num{font-weight:800;font-size:14px;line-height:1;}
.cal-day .cnt{font-size:10px;font-weight:700;color:var(--ok);line-height:1;}
.cal-day.empty{border:none;background:none;pointer-events:none;}
.cal-day.off{opacity:.4;}
.cal-day.off .cnt{color:var(--text-3);}
/* TODAY — always a solid GREEN highlight of the day and its date,
   in every month where today appears (including weekends) */
.cal-day.today{border-color:var(--primary);background:var(--primary);color:#fff;opacity:1;
  box-shadow:0 0 0 3px var(--primary-soft),0 4px 12px rgba(21,128,61,.35);}
.cal-day.today .num{font-weight:900;font-size:15px;}
.cal-day.today .cnt{color:rgba(255,255,255,.94);}
.cal-day.today::after{content:'Today';position:absolute;top:-7px;left:50%;transform:translateX(-50%);
  font-size:8.5px;font-weight:800;background:var(--surface);color:var(--primary-strong);
  padding:1px 7px;border-radius:99px;letter-spacing:.04em;white-space:nowrap;
  border:1.5px solid var(--primary);box-shadow:0 2px 6px rgba(0,0,0,.16);}
body.dark .cal-day.today{background:var(--primary-strong);color:#04140B;
  box-shadow:0 0 0 3px rgba(74,222,128,.2),0 4px 12px rgba(0,0,0,.45);}
body.dark .cal-day.today .cnt{color:rgba(4,20,11,.82);}
body.dark .cal-day.today::after{background:#0B1F14;color:#4ADE80;border-color:#4ADE80;}
.cal-day.sel{background:var(--primary);border-color:var(--primary);color:#fff;}
.cal-day.sel .cnt{color:rgba(255,255,255,.9);}
/* the highlighted weekday column header (SUN..SAT) for today's column */
.cal-dow.dow-today{color:#fff;background:var(--primary);border-radius:8px;padding:3px 0 4px;
  box-shadow:0 2px 8px rgba(21,128,61,.3);}
body.dark .cal-dow.dow-today{background:var(--primary-strong);color:#04140B;}

/* ===== READ-ONLY CALENDAR (dates never clickable, never blurred) =====
   The date grid is inert; only the month title and month arrows work. */
.cal-ro .cal-grid,.cal-ro .cal-grid *{cursor:default !important;pointer-events:none !important;
  -webkit-user-select:none;user-select:none;outline:none !important;
  filter:none !important;backdrop-filter:none !important;-webkit-backdrop-filter:none !important;}
.cal,.cal *{backdrop-filter:none !important;-webkit-backdrop-filter:none !important;filter:none !important;}
.cal-ro .cal-day:hover{border-color:var(--border);background:var(--surface-2);}
.cal-ro .cal-day.off:hover{opacity:.4;background:var(--surface-2);}
.cal-ro .cal-day.today:hover{border-color:var(--primary);background:var(--primary);opacity:1;
  box-shadow:0 0 0 3px var(--primary-soft),0 6px 16px rgba(21,128,61,.45);}
body.dark .cal-ro .cal-day.today:hover{background:var(--primary-strong);}
.cal-ro .cal-day:active{transform:none !important;box-shadow:none !important;}
.ym-title.ym-static{cursor:default !important;font-weight:800;}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:0 15px 13px;font-size:11.5px;color:var(--text-3);}
.cal-legend span{display:inline-flex;align-items:center;gap:5px;}
/* always-visible green badge: what weekday and what date "today" is */
.cal-legend .today-chip{font-weight:800;color:#fff;background:var(--primary);
  padding:3px 10px;border-radius:99px;letter-spacing:.02em;
  box-shadow:0 2px 8px rgba(21,128,61,.32);}
.cal-legend .today-chip .ico{width:13px;height:13px;}
body.dark .cal-legend .today-chip{background:var(--primary-strong);color:#04140B;}

/* =========================================================
   student detail: profile / ID card tabs
   ========================================================= */
.tabs{display:flex;gap:3px;padding:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);width:max-content;max-width:100%;flex-wrap:wrap;}
.tabs button{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:8px;font-size:13.5px;font-weight:700;color:var(--text-2);}
.tabs button .ico{width:16px;height:16px;}
.tabs button.on{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-sm);}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:2px 22px;}
.info-item{display:flex;flex-direction:column;gap:1px;padding:9px 0;border-bottom:1px dashed var(--border);}
.info-item label{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);}
.info-item .val{font-size:13.5px;font-weight:600;word-break:break-word;}
.info-item .val.empty-val{color:var(--text-3);font-weight:500;font-style:italic;}
.id-head-sec{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.id-head-sec .who-txt{min-width:0;}
.id-head-sec h2{font-size:21px;}
.id-head-sec .sub{font-size:12.5px;color:var(--text-3);}
.chart-box{position:relative;height:260px;}
.chart-box.sm{height:210px;}
.latest-box{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;margin-bottom:13px;font-size:13px;}
.latest-box b{font-family:var(--font-display);}

/* =========================================================
   ID card (CR79)
   ========================================================= */
.idcard{width:307.5px; /* 2.051in @150dpi */ aspect-ratio:2.051/3.303;background:#fff;color:#17211B;border-radius:12px;
  overflow:hidden;display:flex;flex-direction:column;border:1px solid #D8DED8;box-shadow:var(--shadow);}
.idcard.dark-card{background:#0F1A13;color:#EAF3EC;}
.idc-top{display:flex;align-items:center;gap:7px;padding:7px 9px;background:linear-gradient(135deg,#15803D,#166534);color:#fff;}
.idc-top img{width:26px;height:26px;border-radius:5px;object-fit:cover;background:#fff;}
.idc-top b{font-size:12.5px;font-family:var(--font-display);letter-spacing:-.01em;line-height:1.1;}
.idc-top span{display:block;font-size:6.6px;opacity:.92;letter-spacing:.05em;text-transform:uppercase;font-weight:600;font-family:var(--font);}
.idc-name{padding:6px 9px 3px;font-size:16px;font-weight:800;font-family:var(--font-display);line-height:1.1;}
.idc-sub{padding:0 9px 6px;font-size:8px;font-weight:700;color:#15803D;letter-spacing:.05em;text-transform:uppercase;}
.idc-main{display:flex;gap:8px;padding:0 9px;}
.idc-photo{width:66px;height:78px;border-radius:6px;overflow:hidden;background:#EEF3EE;flex:0 0 auto;display:grid;place-items:center;
  color:#15803D;font-weight:800;font-size:20px;border:1px solid #DCE6DD;}
.idc-photo img{width:100%;height:100%;object-fit:cover;}
.idc-rows{flex:1;min-width:0;display:flex;flex-direction:column;gap:1.5px;}
.idc-row{display:flex;gap:4px;justify-content:space-between;align-items:baseline;border-bottom:1px dotted #D3DBD4;padding-bottom:1px;}
.idc-row b{font-size:5.6px;text-transform:uppercase;color:#5C6B61;font-weight:800;letter-spacing:.03em;flex:0 0 auto;}
.idc-row span{font-size:7.6px;font-weight:700;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.idc-qr{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 9px 4px;}
.idc-qr .qr-box{width:104px;height:104px;background:#fff;border-radius:7px;padding:5px;border:1px solid #DCE6DD;display:grid;place-items:center;}
.idc-qr .qr-box img,.idc-qr .qr-box canvas{width:100%;height:100%;display:block;image-rendering:pixelated;}
.idc-qr small{font-size:6.4px;font-weight:800;letter-spacing:.09em;color:#5C6B61;text-transform:uppercase;}
.idc-foot{margin-top:auto;padding:5px 9px 7px;font-size:6.2px;color:#5C6B61;text-align:center;line-height:1.35;border-top:1px solid #E4EAE4;}
.idc-foot b{color:#15803D;}
.idc-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}

/* =========================================================
   modal
   ========================================================= */
.modal-back{position:fixed;inset:0;background:rgba(12,22,16,.5);backdrop-filter:blur(3px);z-index:8000;
  display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .16s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{position:fixed;inset:0;margin:auto;z-index:8001; /* centered in the viewport, above the backdrop */
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
  width:100%;max-width:720px;max-height:calc(100vh - 40px);display:flex;flex-direction:column;overflow:hidden;animation:popIn .18s ease;}
.modal.wide{max-width:980px;}
.modal.narrow{max-width:470px;}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 19px;border-bottom:1px solid var(--border);}
.modal-head h2{font-size:18px;}
.modal-body{padding:19px;overflow:auto;flex:1;}
.modal-foot{padding:13px 19px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;}
.x-btn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--text-3);}
.x-btn:hover{background:var(--danger-soft);color:var(--danger);}
.x-btn .ico{width:17px;height:17px;}

/* theme / colour pickers */
.swatches{display:flex;gap:8px;flex-wrap:wrap;}
.swatch{width:38px;height:38px;border-radius:11px;border:2px solid var(--border);cursor:pointer;position:relative;transition:all .14s;}
.swatch:hover{transform:scale(1.06);}
.swatch.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
.swatch.on::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;
  text-shadow:0 1px 2px rgba(0,0,0,.55);}
.swatch.on.light-sw::after{color:#17211B;text-shadow:none;}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px dashed var(--border);flex-wrap:wrap;}
.set-row:last-child{border-bottom:none;}
.set-row .lbl b{display:block;font-size:13.5px;}
.set-row .lbl span{font-size:12px;color:var(--text-3);}
/* Round 4 §3 — logo preview shown BEFORE a new logo is applied */
.logo-preview{margin-top:12px;padding:12px;border:1px dashed var(--primary-line);border-radius:var(--radius);
  background:var(--primary-soft);display:flex;flex-direction:column;gap:10px;animation:popIn .2s ease both;}
.logo-preview .lp-head{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--text-2);line-height:1.5;}
.logo-preview .lp-head .ico{width:16px;height:16px;flex:0 0 auto;color:var(--primary);}
.logo-preview .lp-stage{display:grid;place-items:center;min-height:150px;padding:12px;border-radius:var(--radius-sm);
  background:var(--surface);border:1px solid var(--border);}
.logo-preview .lp-stage img{max-width:100%;max-height:190px;object-fit:contain;}   /* never stretched */
.logo-preview .lp-actions{display:flex;gap:8px;flex-wrap:wrap;}
.switch{width:44px;height:25px;border-radius:99px;background:var(--border-strong);position:relative;transition:background .18s;flex:0 0 auto;}
.switch i{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:var(--shadow-sm);}
.switch.on{background:var(--primary);}
.switch.on i{transform:translateX(19px);}
input[type=range]{accent-color:var(--primary);width:170px;}

/* export preview */
.prev-wrap{overflow:auto;max-height:250px;border:1px solid var(--border);border-radius:var(--radius-sm);}
.prev-sheet{padding:10px 12px;border-bottom:1px solid var(--border);background:var(--surface-2);}
.prev-sheet:last-child{border-bottom:none;}
.prev-sheet b{font-size:12.5px;}

/* toasts */
.toast{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--radius-sm);background:var(--surface);
  border:1px solid var(--border);box-shadow:var(--shadow-lg);animation:slideIn .22s ease;}
@keyframes slideIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.toast .ico{width:18px;height:18px;flex:0 0 auto;margin-top:1px;}
.toast b{display:block;font-size:13.5px;}
.toast p{font-size:12.5px;color:var(--text-3);margin-top:1px;}
.toast.ok .ico{color:var(--ok);} .toast.err .ico{color:var(--danger);}
.toast.warn .ico{color:var(--warn);} .toast.info .ico{color:var(--info);}

/* scanner */
.scan-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;}
.scan-view{position:relative;background:#0B120E;border-radius:var(--radius);overflow:hidden;aspect-ratio:4/3;display:grid;place-items:center;}
.scan-view video{width:100%;height:100%;object-fit:cover;}
.scan-frame{position:absolute;inset:16%;border-radius:14px;border:3px solid rgba(255,255,255,.7);box-shadow:0 0 0 9999px rgba(0,0,0,.32);pointer-events:none;}
.scan-frame::before,.scan-frame::after{content:'';position:absolute;left:-3px;right:-3px;height:4px;background:var(--primary);border-radius:3px;}
.scan-frame::before{top:-3px;} .scan-frame::after{bottom:-3px;}
.cam-status{display:flex;align-items:center;gap:7px;padding:9px 12px;font-size:12.5px;color:var(--text-2);}
.cam-dot{width:9px;height:9px;border-radius:50%;background:var(--border-strong);}
.cam-dot.live{background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft);}
.notfound-card{background:var(--danger-soft);border:1px solid var(--danger);border-radius:var(--radius);padding:16px;
  display:flex;align-items:center;gap:11px;color:var(--danger);}
.found-card{background:var(--ok-soft);border:1px solid var(--primary-line);border-radius:var(--radius);padding:16px;}

/* =========================================================
   GRADE & SECTION — summary bar + grade rail + section folders
   (Revision Round 3: SUMMARY (ALL) header, G11/G12 rail on the
   left, section folders on the right, selected grade highlighted)
   ========================================================= */
.gs-summary{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  background:var(--surface);border:2px solid var(--primary-line);border-radius:var(--radius);
  padding:13px 16px;margin-bottom:14px;box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%;
  transition:all .16s;}
.gs-summary:hover{border-color:var(--primary);box-shadow:var(--shadow);}
.gs-summary .gs-t{display:flex;align-items:center;gap:10px;}
.gs-summary h1{font-size:20px;text-transform:uppercase;letter-spacing:.04em;}
.gs-summary .gs-t .ico{width:22px;height:22px;color:var(--primary);}
.gs-summary .gs-stats{display:flex;gap:18px;flex-wrap:wrap;}
.gs-summary .gs-stats div{display:flex;flex-direction:column;line-height:1.2;}
.gs-summary .gs-stats b{font-size:18px;font-family:var(--font-display);}
.gs-summary .gs-stats span{font-size:11px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:.05em;}
.gs-summary.all-on{border-color:var(--primary);background:var(--primary-soft);}
.gs-layout{display:grid;grid-template-columns:132px minmax(0,1fr);gap:14px;align-items:start;}
.gs-rail{display:flex;flex-direction:column;gap:10px;position:sticky;top:84px;}
.gs-rail-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:16px 10px;border-radius:var(--radius);border:2px solid var(--border);background:var(--surface);
  box-shadow:var(--shadow-sm);transition:all .16s;text-align:center;width:100%;}
.gs-rail-btn .ico{width:26px;height:26px;color:var(--text-3);}
.gs-rail-btn .gl{font-family:var(--font-display);font-size:19px;font-weight:700;line-height:1;}
.gs-rail-btn .gn{font-size:10.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;}
.gs-rail-btn:hover{transform:translateY(-2px);border-color:var(--primary-line);box-shadow:var(--shadow);}
.gs-rail-btn.on{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 0 0 4px var(--primary-soft),var(--shadow);}
.gs-rail-btn.on .ico,.gs-rail-btn.on .gn{color:rgba(255,255,255,.9);}
body.dark .gs-rail-btn.on{color:#04140B;}
body.dark .gs-rail-btn.on .ico,body.dark .gs-rail-btn.on .gn{color:rgba(4,20,11,.8);}
.gs-rail-btn.on::after{content:'OPEN';font-size:9px;font-weight:800;letter-spacing:.12em;opacity:.85;}
.gs-panel{min-width:0;}
/* Round 4 §2 — empty Grade & Section state: clean panel, school logo only */
.gs-empty{position:relative;display:flex;align-items:center;justify-content:center;min-height:330px;overflow:hidden;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
  animation:popIn .26s ease both;}
.gs-empty-bg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(72%,430px);height:min(72%,430px);
  background-repeat:no-repeat;background-position:center;background-size:contain;
  pointer-events:none;transition:opacity .18s ease;}
.gs-empty-hint{position:relative;z-index:1;font-size:13.5px;font-weight:600;color:var(--text-3);
  text-align:center;padding:0 24px;line-height:1.65;}
.gs-empty-hint b{color:var(--text-2);}
.sect-grid{animation:fadeIn .24s ease both;}
.gs-panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:11px;}
.gs-panel-head h2{font-size:17px;}
/* section folders (folder tab on top) */
.sect-tile.folder{padding-top:22px;overflow:hidden;}
.sect-tile.folder::before{content:'';position:absolute;left:15px;top:-1px;width:56px;height:14px;
  background:var(--primary-soft);border:1px solid var(--border);border-bottom:none;border-radius:8px 8px 0 0;}
.sect-tile.folder.on::before{background:var(--primary);border-color:var(--primary);}
.sect-tile.folder .ico-wrap{background:linear-gradient(135deg,var(--primary-soft),var(--surface-2));}

/* =========================================================
   CALENDAR — month / year picker overlay (reference design)
   ========================================================= */
.ym-back{position:fixed;inset:0;background:rgba(6,12,9,.74);z-index:8100;
  animation:ftFadeIn .18s ease;}
/* the dialog lives in its OWN fixed layer above the backdrop, centred,
   so it can never be painted over by the blur (it used to be a static
   sibling of .ym-back and rendered far below the fold) */
.ym-layer{position:fixed;inset:0;z-index:8101;display:flex;align-items:center;justify-content:center;
  padding:18px;pointer-events:none;}
.ym-layer .ym-modal{pointer-events:auto;max-height:calc(100vh - 36px);overflow-y:auto;}
.ym-modal{background:var(--surface);border:1px solid var(--border);border-radius:26px;
  box-shadow:var(--shadow-lg);width:100%;max-width:430px;overflow:hidden;
  animation:ftPop .24s cubic-bezier(.22,.61,.36,1) both;}
body.dark .ym-modal{background:#242424;border-color:#3a3a3a;}
.ym-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:22px 20px 4px;background:transparent;border:none;}
.ym-modal .ym-title{display:inline-flex;align-items:center;gap:9px;
  font-family:var(--font-display);font-size:25px;line-height:1.2;font-weight:700;
  background:transparent;border:none;border-radius:12px;padding:0;cursor:pointer;color:var(--text);}
.ym-modal .ym-title:hover{opacity:.85;}
.ym-modal .ym-title .yr{color:var(--danger);}
.ym-modal .ym-title .ico{width:20px;height:20px;opacity:.8;}
.ym-modal .x-btn{flex:0 0 auto;width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;background:rgba(128,128,128,.22);color:var(--text);
  border:none;cursor:pointer;transition:background .16s ease,transform .14s ease;}
.ym-modal .x-btn:hover{background:rgba(128,128,128,.36);transform:scale(1.06);}
.ym-modal .x-btn .ico{width:22px;height:22px;}
.ym-cols{display:grid;grid-template-columns:1fr 1fr;gap:0;padding:14px 14px 22px;}
.ym-col{max-height:330px;overflow-y:auto;padding:4px;display:flex;flex-direction:column;gap:3px;
  scrollbar-width:thin;}
.ym-col+.ym-col{border-left:1px solid transparent;}
.ym-modal .ym-item{padding:11px 12px;border-radius:14px;border:1.5px solid transparent;
  font-size:19px;font-weight:600;letter-spacing:-.01em;text-align:center;
  color:rgba(140,140,140,.72);background:transparent;
  transition:background .16s ease,color .16s ease,transform .14s ease;}
body.dark .ym-modal .ym-item{color:rgba(170,170,170,.6);}
.ym-modal .ym-item:hover{background:rgba(128,128,128,.18);color:var(--text);border-color:transparent;}
.ym-modal .ym-item.on{background:rgba(128,128,128,.30);color:var(--text);font-weight:700;
  border-color:transparent;box-shadow:none;}
.ym-modal .ym-item.on .tick{margin-left:auto;opacity:.85;}
.ym-modal .ym-item{display:flex;align-items:center;justify-content:center;gap:6px;}
.ym-modal .ym-item.on{justify-content:center;}

/* =========================================================
   MEASUREMENT UNITS (cm/ft · kg/lbs) beside the fields
   ========================================================= */
.unit-field{display:flex;gap:7px;align-items:stretch;}
.unit-field .inp{flex:1;min-width:0;}
.unit-sel{flex:0 0 auto;min-width:66px;padding:9px 8px;border-radius:var(--radius-sm);border:1.5px solid var(--border);
  background:var(--surface-2);font-size:12.5px;font-weight:700;cursor:pointer;color:var(--text-2);}
.unit-sel:focus{outline:none;border-color:var(--primary);}
.unit-cap{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);
  display:flex;align-items:center;gap:5px;margin-bottom:4px;}

/* =========================================================
   ACCOUNT page + unified colour palette
   ========================================================= */
.acct-hero{display:flex;gap:15px;align-items:center;flex-wrap:wrap;}
.acct-avatar{width:64px;height:64px;border-radius:16px;background:var(--primary-soft);color:var(--primary);
  display:grid;place-items:center;font-family:var(--font-display);font-size:24px;font-weight:700;border:1px solid var(--primary-line);flex:0 0 auto;}
.acct-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.pal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:9px;}
.pal-card{border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 11px;background:var(--surface-2);}
.pal-chip{height:22px;border-radius:7px;margin-bottom:7px;border:1px solid rgba(0,0,0,.08);}
.pal-card b{display:block;font-size:12.5px;}
.pal-card span{font-size:11.5px;color:var(--text-3);}

/* =========================================================
   responsive
   ========================================================= */
@media(max-width:1150px){ .kpi-row{grid-template-columns:repeat(3,1fr);} }
@media(max-width:1000px){
  .scan-grid{grid-template-columns:1fr;}
  .kpi-row{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:720px){
  .content{padding:14px;}
  .grid2,.grid3{grid-template-columns:1fr;}
  .page-head h1{font-size:22px;}
  .kpi .num{font-size:25px;}
  .roster{grid-template-columns:1fr;}
  .cal-grid{gap:3px;padding:10px;}
  .cal-day .num{font-size:12.5px;}
  .cal-day .cnt{font-size:9px;}
  .modal{max-height:calc(100vh - 20px);}
  .modal-back{padding:10px;}
  .gs-layout{grid-template-columns:1fr;}
  .gs-rail{flex-direction:row;position:static;}
  .gs-rail-btn{flex:1;padding:11px 8px;}
  .gs-rail-btn .ico{width:20px;height:20px;}
  .ym-col{max-height:230px;}
}
@media(max-width:480px){
  .kpi-row{grid-template-columns:1fr 1fr;gap:9px;}
  .kpi{padding:12px;}
  .sect-grid{grid-template-columns:1fr;}
  .landing .logo-box{width:150px;height:150px;}
  .landing h1{font-size:23px;}
}
/* =========================================================
   SMOOTH ANIMATIONS — consistent across every view
   ========================================================= */
@keyframes ftFadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@keyframes ftFadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes ftPop{from{opacity:0;transform:scale(.965) translateY(10px);}to{opacity:1;transform:none;}}
@keyframes ftSlideDown{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}
@keyframes ftSpin{to{transform:rotate(360deg);}}

/* view / section switches */
#view,.view,.page{animation:ftFadeUp .34s cubic-bezier(.22,.61,.36,1) both;}
/* content blocks stagger in */
.panel,.kpi,.cal,.sect-card,.info-item{animation:ftFadeUp .32s cubic-bezier(.22,.61,.36,1) both;}
.kpi:nth-child(2){animation-delay:.03s;}
.kpi:nth-child(3){animation-delay:.06s;}
.kpi:nth-child(4){animation-delay:.09s;}
.kpi:nth-child(5){animation-delay:.12s;}
.kpi:nth-child(6){animation-delay:.15s;}
.kpi:nth-child(7){animation-delay:.18s;}
.kpi:nth-child(8){animation-delay:.21s;}
.panel+.panel,.panel+.cal{animation-delay:.05s;}

/* modals, drawers, overlays */
.modal,.drawer,.ym-modal{animation:ftPop .26s cubic-bezier(.22,.61,.36,1) both;}
.modal-back,.ym-back,.drawer-back{animation:ftFadeIn .22s ease both;}
.dropdown,.menu,.pop,.tip{animation:ftSlideDown .18s ease both;}

/* buttons — smooth hover / active / focus */
.btn{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
  box-shadow .2s ease,transform .14s ease,opacity .18s ease;}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 14px rgba(16,42,30,.13);}
.btn:active:not(:disabled){transform:translateY(0) scale(.985);box-shadow:none;}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none;}
.btn-primary:hover:not(:disabled){box-shadow:0 6px 18px rgba(21,128,61,.26);}

/* navigation + cards + rows */
.nav-item,.side a,.side button,.tab-btn,.topnav a{transition:background-color .18s ease,color .18s ease,border-color .18s ease;}
.card,.kpi,.sect-card,.info-item,.panel{transition:box-shadow .22s ease,border-color .22s ease,transform .22s ease;}
.card:hover,.kpi:hover,.sect-card:hover{box-shadow:0 8px 22px rgba(16,42,30,.10);}
.tbl tbody tr{transition:background-color .15s ease;}
.tbl tbody tr:hover{background:var(--primary-soft);}
.inp,.sel{transition:border-color .18s ease,box-shadow .18s ease,background-color .18s ease;}
.inp:focus,.sel:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
a,li{transition:color .16s ease;}

/* loading indicator while the system processes information */
button:disabled[data-busy="1"],button.is-busy{position:relative;opacity:.62;cursor:progress;color:transparent !important;}
button:disabled[data-busy="1"]::after,button.is-busy::after{content:'';position:absolute;left:50%;top:50%;
  width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;
  border:2.5px solid rgba(255,255,255,.38);border-top-color:#fff;
  animation:ftSpin .7s linear infinite;}
.spinner{display:inline-block;width:16px;height:16px;border-radius:50%;
  border:2.5px solid var(--border);border-top-color:var(--primary);
  animation:ftSpin .7s linear infinite;vertical-align:-3px;}
.loading-row{display:flex;align-items:center;gap:9px;justify-content:center;
  padding:22px;color:var(--text-3);font-size:13px;font-weight:600;}

/* toast */
#toastWrap .toast{animation:ftPop .24s cubic-bezier(.22,.61,.36,1) both;}

/* charts fade in with the panel */
.chart-box{animation:ftFadeIn .4s ease both;}

/* ===== independent graph sliders (one per graph) ===== */
.graph-slider{margin-top:12px;padding:12px 13px;border:1px solid var(--border);
  border-radius:var(--radius-sm);background:var(--surface-2);}
.graph-slider label{display:block;font-size:10.5px;font-weight:800;letter-spacing:.07em;
  text-transform:uppercase;color:var(--text-3);margin-bottom:9px;}
.graph-slider input[type=range]{width:100%;height:6px;border-radius:999px;cursor:pointer;
  background:var(--border-strong);accent-color:var(--primary);
  -webkit-appearance:none;appearance:none;outline:none;
  transition:background .18s ease;}
.graph-slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:19px;height:19px;border-radius:50%;background:var(--primary);
  border:3px solid var(--surface);box-shadow:0 1px 5px rgba(16,42,30,.32);
  transition:transform .14s ease,box-shadow .16s ease;cursor:grab;}
.graph-slider input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15);}
.graph-slider input[type=range]:active::-webkit-slider-thumb{cursor:grabbing;transform:scale(1.05);}
.graph-slider input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;
  background:var(--primary);border:3px solid var(--surface);
  box-shadow:0 1px 5px rgba(16,42,30,.32);cursor:grab;}
.graph-slider input[type=range]::-moz-range-track{height:6px;border-radius:999px;background:var(--border-strong);}
.graph-slider input[type=range]:disabled{opacity:.45;cursor:not-allowed;}
.graph-slider input[type=range]:focus-visible{outline:2.5px solid var(--primary);outline-offset:4px;}
.gs-range{margin-top:9px;font-size:12px;font-weight:700;color:var(--text-2);
  font-variant-numeric:tabular-nums;}

/* respect users who prefer less motion */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;}
}

@media print{
  .side,.topbar,.no-print,.modal-back,#toastWrap{display:none !important;}
  .app{grid-template-columns:1fr;}
  body{background:#fff;}
  body::before{display:none;}
  .content{padding:0;max-width:none;}
  .panel{box-shadow:none;border-color:#ccc;}
  /* ===== QR / ID print: output ONLY the generated print zone =====
     camera, scanner UI, nav, menus and the whole page are excluded. */
  #printZone{display:none;}
  body.print-id #root{display:none !important;}
  body.print-id #printZone{display:block !important;}
  body.print-id,body.print-id .app{background:#fff !important;}
  body.print-id #printZone .qr-card{break-inside:avoid;page-break-inside:avoid;}

  /* ===== print-only QR sheet layout ===== */
  body.print-id #printZone{font-family:Arial,Helvetica,sans-serif;color:#111;}
  body.print-id .qr-sheet{padding:8mm;}
  body.print-id .qr-sheet-title{font-size:15pt;margin:0 0 1mm;font-weight:800;}
  body.print-id .qr-sheet-sub{font-size:9pt;color:#444;margin:0 0 5mm;}
  body.print-id .qr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6mm;}
  body.print-id .qr-card{border:1px solid #bbb;border-radius:6px;padding:5mm;
    text-align:center;break-inside:avoid;page-break-inside:avoid;background:#fff;}
  body.print-id .qr-code{display:grid;place-items:center;margin-bottom:3mm;}
  body.print-id .qr-code svg,body.print-id .qr-code canvas{width:34mm !important;height:34mm !important;
    max-width:100% !important;image-rendering:pixelated;}
  body.print-id .qr-name{font-size:11pt;font-weight:800;line-height:1.25;word-break:break-word;}
  body.print-id .qr-meta{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin-top:2mm;}
  body.print-id .qr-grade,body.print-id .qr-sec{font-size:9pt;font-weight:700;
    background:#eef3ef;border:1px solid #c9d6cd;border-radius:4px;padding:1mm 2.5mm;}
  body.print-id .qr-id{font-size:8pt;color:#555;margin-top:2mm;}
}
</style>

/* =========================================================
   CDLSHS FeedTrack — SBFP (School Based Feeding Program) monitor
   Administrator site for SBFP coordinators, teachers & advisers.

   Front-end app: student records are stored in this browser
   (localStorage) and seeded with the official section list on
   first run.

   ACCESS: sign-in is handled by the local backend server
   (feedtrack-server.ps1). Any @cdlshs.edu.ph address may sign
   in with the school password, which is held ONLY on the server.
   There is no sign-up / create-account path.

   REVISION NOTES
   - Administrator-only (no student-facing portal).
   - Official Grade 11 / Grade 12 sections and advisers.
   - Seeded with the seven real PROGRAMMING 2 beneficiary records.
   - Date-keyed attendance => automatic daily reset, history kept.
   - Feeding days are Monday–Friday; streaks count eligible days only.
   - Attendance, scans, BMI measurements and profiles are retained
     indefinitely (5–10 year school retention policy supported);
     never auto-deleted when a new school year begins.
   ========================================================= */
const LOGO_SRC = "cdlshs%20logo.jpg";

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return (h>>>0)/4294967296;};}
function seeded(seedStr){const gen=hashStr(seedStr);return {next(){return gen();},range(a,b){return a+gen()*(b-a);},pick(arr){return arr[Math.floor(gen()*arr.length)];}};}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseDate(k){return new Date(k+'T00:00:00');}
function fmtDateNice(d){return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function fmtDateFull(k){const d=parseDate(k); return isNaN(d)?'—':d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function monthLabel(y,m){return new Date(y,m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});}
const TODAY=new Date();
function todayKey(){return fmtDate(new Date());}
function nowTime(){return new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});}
function ageFromBirthday(b){const d=parseDate(b); if(isNaN(d)) return ''; const n=new Date(); let a=n.getFullYear()-d.getFullYear(); const m=n.getMonth()-d.getMonth(); if(m<0||(m===0&&n.getDate()<d.getDate())) a--; return a;}
function resizeImage(file,maxW,quality,cb){const r=new FileReader(); r.onload=e=>{const img=new Image(); img.onload=()=>{const sc=Math.min(1,maxW/img.width); const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg',quality));}; img.src=e.target.result;}; r.readAsDataURL(file);}
function initials(name){const p=String(name||'').split(',');const a=(p[1]||p[0]||'').trim()[0]||'';const b=(p[0]||'').trim()[0]||'';return (a+b).toUpperCase()||'?';}
function shortName(name){const p=String(name||'').split(',');return p.length>1?((p[1]||'').trim().split(' ')[0]+' '+(p[0]||'').trim()):String(name||'');}
function toast(kind,title,msg){
  const wrap=$('toastWrap'); if(!wrap) return;
  const el=document.createElement('div');
  el.className='toast '+(kind==='err'?'err':kind==='warn'?'warn':kind==='info'?'info':'ok');
  const ic=kind==='err'?'alert':kind==='warn'?'alert':kind==='info'?'clock':'check';
  el.innerHTML=icon(ic)+'<div><b>'+esc(title||'')+'</b>'+(msg?'<p>'+msg+'</p>':'')+'</div>';
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),320); }, kind==='err'?6200:4200);
}

/* =========================================================
   FEEDING DAYS — Monday to Friday (school feeding schedule)
   Non-feeding days are skipped entirely; they are never counted
   as a missed attendance day.
   ========================================================= */
function isFeedingDay(d){const w=d.getDay(); return w>=1&&w<=5;}
function feedingDayList(fromDate,toDate){
  const out=[]; let d=new Date(fromDate); const end=new Date(toDate); let guard=0;
  while(d<=end&&guard<4000){ if(isFeedingDay(d)) out.push(fmtDate(d)); d=addDays(d,1); guard++; }
  return out;
}
function feedingDaysUpTo(endKey){
  /* feeding days in the last 60 calendar days up to (and including) endKey —
     used for streak lookback and default report ranges */
  const end=parseDate(endKey); if(isNaN(end)) return [];
  const start=addDays(end,-60);
  return feedingDayList(start,end);
}
function feedingDaysBetween(startKey,endKey){
  const a=parseDate(startKey), b=parseDate(endKey);
  if(isNaN(a)||isNaN(b)) return [];
  return feedingDayList(a,b);
}

  risk:{key:'overweight',label:'Overweight',short:'Overweight',dot:'over'},

   ========================================================= */
const HEIGHT_UNITS=['cm','ft'];

  if(kg==null||kg===''||!isFinite(+kg)) return '';
  return unit==='lbs'?round1((+kg)*LB_PER_KG):round1(kg);

  if(v===''||v==null) return null;

  return round1(unit==='ft'?n*CM_PER_FT:n);

  if(v===''||v==null) return null;

   ATTENDANCE — keyed by feeding-day date, so a new day starts
   clean while every previous day is preserved forever.
   status: 'Scanned' | absent (no record)
   ========================================================= */
const A_STATUS={SCANNED:'Scanned'};
function isScanned(s,key){ const a=s&&s.attendance?s.attendance[key]:null; return !!(a&&a.status===A_STATUS.SCANNED); }

/* current streak = consecutive eligible feeding days ending today
   (or the most recent feeding day, if today has not been scanned yet) */
function currentStreak(s){
  const att=s.attendance||{};
  const scanned=k=>{ const a=att[k]; return !!(a&&a.status===A_STATUS.SCANNED); };
  let n=0;
  let d=new Date();
  if(!isFeedingDay(d)) d=addDays(d,-1);
  if(isFeedingDay(d)&&!scanned(fmtDate(d))) d=addDays(d,-1);
  let guard=0;
  while(guard<1200){
    if(isFeedingDay(d)){
      if(!scanned(fmtDate(d))) break;
      n++;
    }
    d=addDays(d,-1); guard++;
  }
  return n;
}

  const keys=Object.keys(s.attendance||{}).filter(k=>isScanned(s,k)).sort();
  if(!keys.length) return 0;
  const set=new Set(keys);
  const first=keys[0];
  const days=feedingDayList(parseDate(first),parseDate(keys[keys.length-1]));
  let best=0, run=0;
  days.forEach(k=>{ if(set.has(k)){ run++; if(run>best) best=run; } else run=0; });
  return Math.max(best,set.size?1:0);

   BACKUP & RECOVERY — every record (students, attendance,
   scans, BMI measurements, history, settings) is exported
   to a JSON file and can be restored later. Nothing is ever
   auto-deleted, so the 5–10 year retention policy is safe.
   ========================================================= */
function backupPayload(){
  return {
    app:'CDLSHS FeedTrack', kind:'feedtrack-backup', v:2,
    savedAt:new Date().toISOString(),
    students:STUDENTS, seq:STUDENT_SEQ,
    advisers:ADVISERS, settings:SETTINGS
  };
}
function downloadBackup(){
  try{
    const blob=new Blob([JSON.stringify(backupPayload(),null,1)],{type:'application/json'});
    const d=new Date();
    const pad=n=>String(n).padStart(2,'0');
    const fname=`FeedTrack_Backup_${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.json`;
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=fname; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },400);
    toast('ok','Backup downloaded',fname+' — keep this file somewhere safe.');
  }catch(e){ toast('err','Backup failed',e&&e.message?e.message:'Could not build the backup file.'); }
}
function restoreBackup(text){
  let d=null;
  try{ d=JSON.parse(text); }catch(e){ d=null; }
  if(!d||d.kind!=='feedtrack-backup'||!d.students){
    toast('err','Not a FeedTrack backup','Choose a backup file previously downloaded from this website.');
    return;
  }
  const n=Object.keys(d.students).length;
  STATE.confirmBox={
    title:'Restore this backup?',
    html:`The file contains <b>${n}</b> student record(s) saved ${d.savedAt?esc(String(d.savedAt).replace('T',' ').slice(0,16)):''}. Restoring replaces ALL current records (students, attendance, scans and BMI history) with the backup contents.`,
    yes:'Restore backup', danger:true,
    onYes:()=>{
      try{
        Object.keys(STUDENTS).forEach(k=>delete STUDENTS[k]);
        Object.keys(d.students).forEach(k=>{ STUDENTS[k]=normalizeStudent(d.students[k]); });
        if(d.seq) STUDENT_SEQ=d.seq;
        if(d.advisers){ Object.keys(ADVISERS).forEach(k=>delete ADVISERS[k]); Object.assign(ADVISERS,d.advisers); }
        if(d.settings) SETTINGS=Object.assign({},DEFAULT_SETTINGS,d.settings);
        STATE.studentId=null; STATE.sectionKey=null; STATE.view='home';
        persistNow(); applySettings(); render();
        toast('ok','Backup restored',n+' student record(s) recovered.');
      }catch(e){ toast('err','Restore failed',e&&e.message?e.message:'The backup could not be applied.'); }
    }
  };
  render();
}

function readableOn(hex){ /* dark or light text so navigation stays readable on any sidebar colour */
  const c=String(hex||'').replace('#','');
  if(c.length!==6) return null;
  const ch=i=>{ const v=parseInt(c.substr(i,2),16)/255; return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4); };
  const L=0.2126*ch(0)+0.7152*ch(2)+0.0722*ch(4);
  return L>0.42?'#26362D':'#E7F0EA';
}
function activeLogoSrc(){
  /* the school logo used everywhere (nav, login, page background).
     Settings may replace it; the official logo is the default. */
  const s=SETTINGS.logoSrc||LOGO_SRC;

function emptyLogoOpacity(){
  /* the decorative logo behind the empty Grade & Section panel uses the SAME
     opacity slider as the page background — so the slider always shows a
     real, visible effect and only ever touches background logos. */
  let op=Number(SETTINGS.bgOpacity);
  if(!isFinite(op)) op=DEFAULT_SETTINGS.bgOpacity;
  return Math.max(.04,Math.min(.40,op));
}
function applySettings(){
  const dark=SETTINGS.theme==='dark';
  document.body.classList.toggle('dark',dark);
  /* each theme keeps its own customizable backgrounds */
  const appKey=dark?'appBgDark':'appBg', sideKey=dark?'sideBgDark':'sideBg';
  const appBg=SETTINGS[appKey]||DEFAULT_SETTINGS[appKey];
  const sideBg=SETTINGS[sideKey]||DEFAULT_SETTINGS[sideKey];
  document.documentElement.style.setProperty('--app-bg',appBg);
  document.documentElement.style.setProperty('--side-bg',sideBg);
  const sideText=readableOn(sideBg);
  if(sideText) document.documentElement.style.setProperty('--side-text',sideText);
  /* ONE coordinated palette (Round 3): green leads the interface, blue
     carries data/attendance, orange carries BMI progress, red stays
     reserved for alerts — the colours never compete. */
  const av=ACCENTS.unified[dark?'dark':'light'];
  const rs=document.documentElement.style;
  rs.setProperty('--primary',av.p); rs.setProperty('--primary-strong',av.ps);
  rs.setProperty('--primary-soft',av.pf); rs.setProperty('--primary-line',av.pl);
  SETTINGS.accent='unified';
  /* page decoration = the official school logo (or nothing).
     Legacy "building"/"photo" choices fold back into the logo so a
     custom upload can never appear distorted behind the page. */
  SETTINGS.bg=(SETTINGS.bg==='none')?'none':'logo';
  document.body.classList.remove('bg-logo','bg-building','bg-photo','bg-none');
  document.body.classList.add('bg-'+SETTINGS.bg);
  const img=SETTINGS.bg==='logo'?`url("${activeLogoSrc()}")`:'none';
  document.documentElement.style.setProperty('--bg-img',img);
  /* opacity slider value (4%–40% keeps every label and button readable) */
  let op=Number(SETTINGS.bgOpacity);
  if(!isFinite(op)) op=DEFAULT_SETTINGS.bgOpacity;
  op=Math.max(.04,Math.min(.40,op));
  document.documentElement.style.setProperty('--bg-opacity',String(op));
  if(typeof chartTheme==='function') chartTheme();
}

const AUTH_EP='/api/auth';
async function authCall(action,body){
  try{
    const r=await fetch(AUTH_EP+'/'+action,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body||{})
    });
    let d={}; try{ d=await r.json(); }catch(e){ d={ok:false,error:'Server returned an unexpected response.'}; }
    if(!r.ok&&!d.error) d.error='Request failed ('+r.status+').';
    return d;
  }catch(e){
    /* opened without the backend server (file:// or server stopped) */
    return {ok:false,error:'Cannot reach the FeedTrack server. Open the website through feedtrack-server.ps1 (http://localhost:8765/code2.html) and try again.'};
  }
}
function saveToken(tok,email){
  STATE.authToken=tok||''; STATE.email=email||'';
  try{ if(tok) sessionStorage.setItem('feedtrack.token',tok); else sessionStorage.removeItem('feedtrack.token'); }catch(e){}
}

}
function attachLoginEvents(){
  const on=(id,fn)=>{ const el=$(id); if(el) el.onclick=fn; };
  const em=$('authEmail'); if(em) em.oninput=()=>{ STATE.authEmailVal=em.value; };
  /* SHOW / HIDE password toggles are handled by the shared delegated
     listener in p6a so every screen (login, account) behaves the same */
  on('toForgot',()=>{STATE.authMode='forgot'; STATE.authMsg=''; STATE.authError=''; render();});
  on('toLogin',()=>{STATE.authMode='login'; STATE.authError=''; STATE.authMsg=''; render();});
  on('btnForgotSend',sendResetCode);
  on('btnResend',sendResetCode);
  on('btnAuthSubmit',submitAuth);
  on('btnResetSubmit',submitReset);
  ['authPassword','authPassword2','authEmail','authCode'].forEach(i=>{ const el=$(i); if(el) el.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const b=$('btnResetSubmit')||$('btnAuthSubmit')||$('btnForgotSend'); if(b) b.click(); } }); });
}
async function sendResetCode(){
  const email=($('authEmail')?$('authEmail').value:'').trim().toLowerCase();
  if(!validEmail(email)){ STATE.authMsg='Please enter your registered e-mail address.'; render(); return; }
  STATE.authBusy=true; STATE.authMsg='Sending verification code to '+email+'…'; render();
  const d=await authCall('forgot',{email});
  STATE.authBusy=false;
  if(!d.ok){ STATE.authMsg=d.error||'Could not send the code. Try again.'; render(); return; }
  /* the code is issued for THIS account's own registered address */
  STATE.authEmailVal=email;
  STATE.authSentTo=d.sentTo||email;
  STATE.authWarning=d.warning||'';
  STATE.authMode='reset'; STATE.authMsg=''; STATE.authError='';
  render();
  if(d.warning){
    toast('warn','Code created — e-mail not yet configured',d.warning);
  }else{
    toast('ok','Verification code sent','A 6-digit code was e-mailed to '+STATE.authSentTo+'. It expires in 10 minutes.');
  }
  const c=$('authCode'); if(c) c.focus();
}
async function submitAuth(){
  const email=($('authEmail')?$('authEmail').value:'').trim().toLowerCase();
  const pw=$('authPassword')?$('authPassword').value:'';
  if(!validEmail(email)){ STATE.authError='Please enter your registered e-mail address.'; render(); return; }
  if(!pw){ STATE.authError='Please enter your password.'; render(); return; }
  STATE.authBusy=true; STATE.authError=''; render();
  const d=await authCall('login',{email,password:pw});
  STATE.authBusy=false;
  if(!d.ok){ STATE.authError=d.error||'Login failed.'; render(); return; }
  saveToken(d.token,email);
  STATE.userName=d.name||email.split('@')[0];
  STATE.loggedIn=true; STATE.authError=''; STATE.authMsg=''; STATE.authEmailVal='';
  STATE.authSentTo=''; STATE.authWarning='';
  STATE.view='home'; render();
  toast('ok','Signed in','Welcome back, '+STATE.userName+'.');
}
async function submitReset(){
  const email=STATE.authEmailVal||'';
  const code=($('authCode')?$('authCode').value:'').trim();
  const p1=$('authPassword')?$('authPassword').value:'';
  const p2=$('authPassword2')?$('authPassword2').value:'';
  if(!/^\d{6}$/.test(code)){ STATE.authError='Enter the 6-digit verification code.'; render(); return; }
  if(p1.length<6){ STATE.authError='The new password must be at least 6 characters.'; render(); return; }
  if(p1!==p2){ STATE.authError='Passwords do not match.'; render(); return; }
  STATE.authBusy=true; STATE.authError=''; render();
  const d=await authCall('reset',{email,code,password:p1});
  STATE.authBusy=false;
  if(!d.ok){ STATE.authError=d.error||'Reset failed.'; render(); return; }
  STATE.authMode='login'; STATE.authEmailVal=email; STATE.authError='';
  STATE.authMsg='Password reset successfully. Please log in with your new password.';
  STATE.authSentTo=''; STATE.authWarning='';
  render();
  toast('ok','Password reset','Your new password is active for '+email+'.');
}
async function validateSession(){
  let tok=''; try{ tok=sessionStorage.getItem('feedtrack.token')||''; }catch(e){}
  if(!tok) return false;
  STATE.authToken=tok;
  const d=await authCall('session',{token:tok});
  if(d.ok&&d.email){
    STATE.loggedIn=true; STATE.email=d.email; STATE.userName=d.name||''; STATE.userRole=d.role||'';
    return true;
  }
  saveToken('',''); return false;
}
async function logout(){
  try{ if(STATE.authToken) await authCall('logout',{token:STATE.authToken}); }catch(e){}
  saveToken('','');
  STATE.loggedIn=false; STATE.authMode='login'; STATE.view='home'; STATE.sectionKey=null; STATE.studentId=null;
  STATE.authError=''; STATE.authMsg=''; STATE.userName=''; STATE.userRole='';
  STATE.account={name:'',email:'',role:'',created:''};
  render(); toast('info','Signed out','You have been logged out.');
}

/* =========================================================
   ACCOUNT (Revision Round 3) — the signed-in user's own record,
   fetched from the server with this session's token, so one
   user's data can never appear in another user's account.
   ========================================================= */
async function loadAccount(){
  if(!STATE.authToken) return;
  const d=await authCall('account/get',{token:STATE.authToken});
  if(d.ok&&d.user){
    STATE.account=d.user;
    STATE.email=d.user.email; STATE.userName=d.user.name; STATE.userRole=d.user.role||'';
    if(STATE.view==='account') render();
  }else if(d.error){
    STATE.accountErr=d.error;
    if(STATE.view==='account') render();
  }
}
async function saveAccount(){
  const nm=($('acctName')?$('acctName').value:'').trim();
  const em=($('acctEmail')?$('acctEmail').value:'').trim().toLowerCase();
  if(nm.length<2){ STATE.accountErr='Enter your full name (at least 2 characters).'; render(); return; }
  if(!validEmail(em)){ STATE.accountErr='Enter a valid e-mail address.'; render(); return; }
  STATE.acctBusy=true; STATE.accountErr=''; STATE.accountMsg=''; render();
  const d=await authCall('account/update',{token:STATE.authToken,name:nm,email:em});
  STATE.acctBusy=false;
  if(!d.ok){ STATE.accountErr=d.error||'Could not update the account.'; render(); toast('err','Not saved',STATE.accountErr); return; }
  STATE.account=d.user||STATE.account;
  STATE.email=STATE.account.email; STATE.userName=STATE.account.name;
  STATE.accountMsg=d.emailChanged
    ? 'Account updated. Your new e-mail address ('+STATE.account.email+') is now used for password recovery.'
    : 'Account updated.';
  STATE.accountErr='';
  render();
  toast('ok','Account saved',STATE.accountMsg);
}
async function changePassword(){
  const cur=$('pwCurrent')?$('pwCurrent').value:'';
  const n1=$('pwNew')?$('pwNew').value:'';
  const n2=$('pwNew2')?$('pwNew2').value:'';
  if(!cur){ STATE.accountErr='Enter your current password.'; render(); return; }
  if(n1.length<6){ STATE.accountErr='The new password must be at least 6 characters.'; render(); return; }
  if(n1!==n2){ STATE.accountErr='The new passwords do not match.'; render(); return; }
  STATE.acctBusy=true; STATE.accountErr=''; render();
  const d=await authCall('change-password',{token:STATE.authToken,currentPassword:cur,newPassword:n1});
  STATE.acctBusy=false;
  if(!d.ok){ STATE.accountErr=d.error||'Could not change the password.'; render(); toast('err','Password not changed',STATE.accountErr); return; }
  STATE.accountErr=''; STATE.accountMsg='Password changed successfully. Use the new password the next time you sign in.';
  render();
  toast('ok','Password changed','Your password was updated securely.');
}

/* ---------- calendar (READ-ONLY: never clickable, never opens overlays) ---------- */
function renderCalendar(){
  const y=STATE.calY, m=STATE.calM;
  const first=new Date(y,m,1);
  const startDow=first.getDay();
  const dim=new Date(y,m+1,0).getDate();
  const dow=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  /* today's green highlight — the day-of-week header and the date cell,
     shown in every month in which today actually appears */
  const tk=todayKey();
  const viewingToday=(y===TODAY.getFullYear()&&m===TODAY.getMonth());
  const todayDow=viewingToday?TODAY.getDay():-1;
  const todayLabel=TODAY.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  let cells='';
  for(let i=0;i<startDow;i++) cells+='<div class="cal-day empty" aria-hidden="true"></div>';
  for(let d=1;d<=dim;d++){
    const date=new Date(y,m,d);
    const key=fmtDate(date);
    const feed=isFeedingDay(date);
    const cnt=feed?scannedCountOn(key):0;
    const today=key===tk;
    const sel=key===STATE.calSel;
    cells+=`<div class="cal-day ${feed?'':'off'} ${today?'today':''} ${sel&&!today?'sel':''}" data-cal-cell="${key}"
      aria-label="${esc(fmtDateFull(key))}${today?' — today':''}${feed?', '+cnt+' scanned':', not a feeding day'}">
      <span class="num">${d}</span>${feed?`<span class="cnt">${cnt} scanned</span>`:`<span class="cnt">—</span>`}</div>`;
  }
  return `<div class="cal cal-ro">
    <div class="cal-head">
      <button class="ym-title" data-act="open-ym" aria-label="Choose month and year">
        ${esc(monthLabel(y,m))} ${icon('next','chev')}
      </button>
      <div class="cal-nav">
        <button data-cal-nav="-1" aria-label="Previous month">${icon('back')}</button>
        <button class="btn btn-sm btn-ghost" data-cal-nav="0">Today</button>
        <button data-cal-nav="1" aria-label="Next month">${icon('next')}</button>
      </div>
    </div>
    <div class="cal-grid">${dow.map((d,i)=>`<div class="cal-dow${i===todayDow?' dow-today':''}">${d}</div>`).join('')}${cells}</div>
    <div class="cal-legend">
      <span><i class="dot ok"></i> scanned count</span>
      <span><i class="dot muted"></i> non-feeding day (skipped)</span>
      <span class="today-chip">${icon('calendar')} Today · ${esc(todayLabel)}</span>
      <span class="hint">Tap the month above to jump to any month &amp; year · dates are display-only</span>
    </div>
  </div>`;
}

/* the picker writes straight through to the Home calendar so the grid,
   the selected day and the attendance panel always show the right month */
function syncPickerToCalendar(){
  STATE.calY=STATE.ymY; STATE.calM=STATE.ymM;
  const cur=parseDate(STATE.calSel);
  if(isNaN(cur)||cur.getFullYear()!==STATE.calY||cur.getMonth()!==STATE.calM){
    const dim=new Date(STATE.calY,STATE.calM+1,0).getDate();
    const day=Math.min(isNaN(cur)?1:cur.getDate(),dim);
    STATE.calSel=fmtDate(new Date(STATE.calY,STATE.calM,day));
  }
}
function scrollYmToSelection(){
  ['ymMonths','ymYears'].forEach(id=>{
    const box=$(id); if(!box) return;
    const on=box.querySelector('.ym-item.on');
    if(on) box.scrollTop=Math.max(0,on.offsetTop-box.clientHeight/2+on.offsetHeight/2);
  });
}
function renderDayAttendance(key){
  const all=allStudents();
  const feed=isFeedingDay(parseDate(key));
  if(!feed) return `<div class="empty">${icon('calendar')}<h3>Not a feeding day</h3>
    <p>${esc(fmtDateFull(key))} falls on a weekend, so no feeding session is scheduled and it is never counted as a missed day.</p></div>`;

  const rows=all.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(s=>{

    return `<tr>

function avatarHTML(s,cls){
  if(s.photo) return `<span class="avatar ${cls||''}"><img src="${s.photo}" alt="Photo of ${esc(s.name)}"></span>`;
  return `<span class="avatar ${cls||''}">${esc(initials(s.name))}</span>`;

function streakHTML(s,big){
  const st=streakOf(s);
  const unlocked=hasTenDay(s)||st.current>=STREAK_GOAL;
  return `<span class="streak ${unlocked?'unlocked':'locked'} ${big?'streak-lg':''}" title="Current streak ${st.current} day(s) · longest ${st.longest}">

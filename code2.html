function sectionRoster(){
  const key=STATE.sectionKey;
  const all= key==='ALL' ? allStudents() : studentsInSection(key);
  const info=secOf(key);
  const adv= info?(ADVISERS[key]||'TBA'):'—';
  const tk=STATE.calSel||todayKey();
  const feed=isFeedingDay(parseDate(tk));
  const q=(STATE.rosterQuery||'').toLowerCase().trim();
  let list=all.filter(s=>{
    if(!q) return true;
    const hay=(s.name+' '+s.id+' '+(s.lrn||'')).toLowerCase();
    return q.split(/\s+/).every(p=>hay.includes(p));
  });
  const f=STATE.rosterFilter;
  list=list.filter(s=>{
    const ok=isScanned(s,tk);
    if(f==='scanned') return ok;
    if(f==='not') return feed&&!ok;
    if(f==='under') return isUnder(s);
    if(f==='photo') return !!s.photo;
    return true;
  });
  const sort=STATE.rosterSort;
  list=list.slice().sort((a,b)=>{
    if(sort==='status') return (isScanned(b,tk)?1:0)-(isScanned(a,tk)?1:0)||a.name.localeCompare(b.name);
    if(sort==='streak') return currentStreak(b)-currentStreak(a)||a.name.localeCompare(b.name);
    return a.name.localeCompare(b.name);

  const scannedN=all.filter(s=>isScanned(s,tk)).length;

      <button data-act="go-grades">${icon('wheat')} Grades</button> ${icon('next','chev')}
      <button data-grade-open="${info?info.grade:(key==='ALL'?11:11)}">Grade ${info?info.grade:'—'}</button> ${icon('next','chev')}
      <span>${esc(info?info.label:'All')}</span></div>
    <div class="summary-bar">
      <div><h1>${esc(title)}</h1>
        <div class="sub" style="font-size:12.5px;color:var(--text-3);">Adviser: ${esc(adv)} · Selected date ${esc(fmtDateFull(tk))}${feed?'':' · not a feeding day'}</div></div>
      <div class="sb-stats">
        <div><b>${all.length}</b><span>Beneficiaries</span></div>
        <div><b>${scannedN}</b><span>Scanned ${feed?'that day':''}</span></div>

      <div class="acts" style="display:flex;gap:8px;flex-wrap:wrap;">

      <select class="inp" id="rosterFilter" aria-label="Filter students">
        <option value="all"${f==='all'?' selected':''}>All students</option>

/* =========================================================

function renderAttendanceRecords(){
  const from=STATE.attFrom||feedingDaysUpTo(todayKey())[0]||todayKey();
  const to=STATE.attTo||todayKey();
  const q=(STATE.attQuery||'').toLowerCase().trim();
  const st=STATE.attStatus||'all';
  let days=feedingDaysBetween(from,to);
  if(days.length>62) days=days.slice(days.length-62); /* keep the table readable */
  let all=allStudents();
  if(STATE.attSection&&STATE.attSection!=='all') all=all.filter(s=>s.sectionKey===STATE.attSection);
  if(q) all=all.filter(s=>{const hay=(s.name+' '+s.id+' '+(s.lrn||'')).toLowerCase(); return q.split(/\s+/).every(p=>hay.includes(p));});
  if(st==='scanned'||st==='not') all=all.filter(s=>{
    return days.some(k=>{const ok=isScanned(s,k); return st==='scanned'?ok:!ok;});
  });
  const rows=[];
  days.slice().reverse().forEach(k=>{
    all.forEach(s=>{
      const a=attendanceOn(s,k); const ok=!!a&&a.status===A_STATUS.SCANNED;
      rows.push(`<tr>
        <td class="mono">${esc(k)}</td>
        <td><div style="display:flex;gap:9px;align-items:center;">${avatarHTML(s)}
          <button class="rc-name" data-open-profile="${s.id}" style="text-align:left;">${esc(s.name)}</button></div></td>
        <td>${esc(secFull(s.sectionKey))}</td>
        <td><span class="badge ${ok?'ok':'muted'}"><i class="dot ${ok?'ok':'muted'}"></i>${ok?'Scanned':'Not Scanned'}</span></td>
        <td class="mono">${ok?esc(a.time):'<span class="missing">—</span>'}</td>
        <td class="mono">${ok&&a.ts?esc(a.ts):'<span class="missing">—</span>'}</td>
        <td>${streakHTML(s)}</td>
      </tr>`);
    });
  });
  const total=days.length*all.length;
  const scannedN=days.reduce((n,k)=>n+all.filter(s=>isScanned(s,k)).length,0);
  return `<div class="page-head">
      <div><h1>Attendance records</h1>
        <div class="sub">${esc(fmtDateFull(from))} → ${esc(fmtDateFull(to))} · feeding days Mon–Fri · ${days.length} day(s)</div></div>
      <div class="acts"><button class="btn btn-secondary" data-act="open-export">${icon('download')} Export to Excel</button></div>
    </div>
    <div class="kpi-row" style="margin-bottom:14px;">
      <div class="kpi"><span class="lab">Records in range</span><span class="num">${total}</span><span class="note">student × day rows</span></div>
      <div class="kpi tone-ok"><span class="lab">Scanned</span><span class="num">${scannedN}</span><span class="note">successful scans</span></div>
      <div class="kpi ${total-scannedN?'tone-warn':''}"><span class="lab">Not scanned</span><span class="num">${total-scannedN}</span><span class="note">no scan recorded</span></div>
      <div class="kpi tone-info"><span class="lab">Attendance rate</span><span class="num">${total?Math.round(scannedN/total*100):0}%</span><span class="note">scans ÷ records</span></div>
    </div>
    <div class="toolbar">
      <div class="sfield" style="max-width:300px;height:38px;">${icon('search')}
        <input id="attSearch" placeholder="Search student…" value="${esc(STATE.attQuery||'')}" aria-label="Search students"></div>
      <label style="font-size:12px;font-weight:700;">From <input class="inp" type="date" id="attFrom" value="${esc(from)}" style="width:auto;"></label>
      <label style="font-size:12px;font-weight:700;">To <input class="inp" type="date" id="attTo" value="${esc(to)}" style="width:auto;"></label>
      <select class="inp" id="attSection" aria-label="Filter by section">
        <option value="all">All sections</option>
        ${SECTIONS.map(x=>`<option value="${x.key}"${STATE.attSection===x.key?' selected':''}>${esc(x.full)}</option>`).join('')}
      </select>
      <select class="inp" id="attStatus" aria-label="Filter by status">
        <option value="all"${st==='all'?' selected':''}>All statuses</option>
        <option value="scanned"${st==='scanned'?' selected':''}>Scanned</option>
        <option value="not"${st==='not'?' selected':''}>Not Scanned</option>
      </select>
    </div>
    ${rows.length?`<div class="tbl-wrap panel"><table class="data">
      <thead><tr><th>Date</th><th>Student</th><th>Grade &amp; section</th><th>Status</th><th>Scan time</th><th>Record timestamp</th><th>Streak</th></tr></thead>
      <tbody>${rows.join('')}</tbody></table></div>`
    :`<div class="panel"><div class="empty">${icon('calendar')}<h3>No attendance records in this range</h3>
      <p>Widen the date range or scan a student ID to record attendance.</p></div></div>`}`;
}

/* =========================================================
   STUDENT PROGRESS (measurements)
   ========================================================= */
function renderProgressView(){
  const all=allStudents().slice().sort((a,b)=>a.name.localeCompare(b.name));
  const measured=all.filter(validMeasurement);
  const rows=all.map(s=>{
    const st=statusOf(s);
    const have=validMeasurement(s);
    const prev=s.history.length>=2?s.history[s.history.length-2]:null;
    const last=validMeasurement(s)?{date:s.measuredAt,height:s.height,weight:s.weight,bmi:s.bmi}:null;
    let change='—';
    if(last&&prev&&prev.bmi&&last.bmi){
      const d=Math.round((last.bmi-prev.bmi)*10)/10;
      change=d>0?`+${d}`:String(d);
    }
    return `<tr>
      <td><div style="display:flex;gap:9px;align-items:center;">${avatarHTML(s)}
        <button class="rc-name" data-open-profile="${s.id}" style="text-align:left;">${esc(s.name)}</button></div></td>
      <td>${esc(secFull(s.sectionKey))}</td>
      <td class="num">${s.height?esc(s.height)+' cm':'<span class="missing">—</span>'}</td>
      <td class="num">${s.weight?esc(s.weight)+' kg':'<span class="missing">—</span>'}</td>
      <td class="num">${s.bmi?esc(s.bmi):'<span class="missing">—</span>'}</td>
      <td>${have&&st.dot?`<span class="badge ${st.key==='underweight'?'warn':(st.key==='normal'?'ok':'info')}">${esc(st.short)}</span>`:'<span class="missing">not measured</span>'}</td>
      <td class="mono">${s.measuredAt?esc(s.measuredAt):'<span class="missing">—</span>'}</td>
      <td class="mono">${esc(change)}</td>
      <td class="mono">${s.history.length}</td>
      <td><button class="mini-btn" data-edit-student="${s.id}">${icon('edit')} Update</button></td>
    </tr>`;
  }).join('');
  return `<div class="page-head">
      <div><h1>Student progress</h1>
        <div class="sub">Height, weight and BMI-for-age recorded every two weeks · ${measured.length} of ${all.length} students measured</div></div>
      <div class="acts"><button class="btn btn-secondary" data-act="open-export">${icon('download')} Export to Excel</button></div>
    </div>
    <div class="panel" style="margin-bottom:14px;"><div class="panel-body" style="display:flex;gap:10px;align-items:flex-start;">
      ${icon('flask')}<div class="hint">BMI is calculated as weight (kg) ÷ height (m)² and classified with the <b>WHO 2007 BMI-for-age</b> reference for school-age children — not adult cut-offs.
      Students with missing age, gender, height or weight show “not measured” instead of an unreliable classification. Average weight is deliberately not reported.</div>
    </div></div>
    ${rows?`<div class="tbl-wrap panel"><table class="data">
      <thead><tr><th>Student</th><th>Grade &amp; section</th><th>Height</th><th>Weight</th><th>BMI</th><th>Classification</th><th>Latest measurement</th><th>Change</th><th>Records</th><th>Action</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`
    :`<div class="panel"><div class="empty">${icon('flask')}<h3>No beneficiaries registered</h3></div></div>`}`;
}

function drawQRs(){
  if(typeof QRCode==='undefined') return;
  document.querySelectorAll('[data-qr]').forEach(box=>{
    if(box.dataset.qrDone==='1') return;
    const text=box.getAttribute('data-qr'); if(!text) return;
    try{
      box.innerHTML='';
      new QRCode(box,{text:text,width:box.classList.contains('qr-box')?150:120,height:box.classList.contains('qr-box')?150:120,
        colorDark:'#111318',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});
      box.dataset.qrDone='1';
    }catch(e){ box.textContent=text; }
  });
}
function printId(id){
  const s=STUDENTS[id]; if(!s) return;
  const zone=$('printZone');
  zone.innerHTML=`<div style="display:grid;place-items:center;padding:12mm;">${idCardHTML(s)}</div>`;
  drawQRs();
  document.body.classList.add('print-id');
  const done=()=>{
    document.body.classList.remove('print-id');
    zone.innerHTML='';
    window.removeEventListener('afterprint',done);
  };
  window.addEventListener('afterprint',done);
  setTimeout(()=>{ try{ window.print(); }catch(e){} setTimeout(done,1500); },300);
}


/* =========================================================
   PROFILE TAB (p5c) — complete student information.
   NOTE: the large QR code is deliberately NOT shown here;
   it lives on the separate ID Card tab.
   ========================================================= */
/* --- independent graph sliders: each graph scrolls its own dates --- */
const GRAPH_WINDOW=8;
/* How many dates fit on screen at once. When everything fits the chart
   would otherwise never change, so a short history is windowed at roughly
   half its length — that keeps the slider genuinely navigable. */
function graphWindowFor(n){
  if(n<=0) return 0;
  if(n>GRAPH_WINDOW) return GRAPH_WINDOW;
  if(n<3) return n;                       /* 1–2 dates: everything is visible */
  return Math.max(2,Math.ceil(n/2));
}
function graphSlice(rows,endIdx){
  const n=rows.length;
  if(!n) return {start:0,end:-1,items:[]};
  const win=Math.min(n,graphWindowFor(n));
  let end=Math.min(n-1,Math.max(0,endIdx==null?n-1:endIdx));
  let start=Math.max(0,end-win+1);
  if(end-start+1<win) end=Math.min(n-1,start+win-1);
  return {start,end,items:rows.slice(start,end+1)};
}
function graphDateShort(k){ const d=parseDate(k); return d?fmtDateNice(d):String(k||''); }
function graphRangeLabel(rows,endIdx){
  const w=graphSlice(rows,endIdx);
  if(!w.items.length) return 'No records';
  const a=graphDateShort(w.items[0].date), b=graphDateShort(w.items[w.items.length-1].date);
  const span=a===b?a:(a+' → '+b);
  if(w.items.length>=rows.length) return 'All '+rows.length+' of '+rows.length+' dates shown · '+span;
  return 'Showing '+(w.start+1)+'–'+(w.end+1)+' of '+rows.length+' · '+span;
}
/* rows are computed in ONE place so the template, the slider handler and
   the chart builder can never disagree about the data.
   PRESENT RECORDS ONLY — Absent/Not Scanned never reach the profile graph. */
function profileAttRows(){
  const s=STUDENTS[STATE.studentId]; if(!s) return [];
  const out=[];
  Object.keys(s.attendance||{}).forEach(k=>{
    const a=s.attendance[k]||{};
    if(a.status===A_STATUS.SCANNED) out.push({date:String(k),present:true});
  });
  (s.scans||[]).forEach(sc=>{
    if(!sc||!sc.date) return;
    if(!out.some(r=>r.date===sc.date)) out.push({date:String(sc.date),present:true});
  });
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
function profileBmiRows(){
  const s=STUDENTS[STATE.studentId]; if(!s) return [];
  return (s.history||[]).filter(h=>h&&h.date&&h.bmi&&isFinite(+h.bmi))
    .map(h=>({date:String(h.date),bmi:Math.round(+h.bmi*10)/10,age:h.age!=null?h.age:s.age}))
    .sort((a,b)=>a.date.localeCompare(b.date));
}
function attRangeLabel(){ return graphRangeLabel(profileAttRows(),STATE.attSlider); }
function bmiRangeLabel(){ return graphRangeLabel(profileBmiRows(),STATE.bmiSlider); }

/* =========================================================
   EVENTS (p6a) — one delegated click/input layer
   ========================================================= */
function closeModals(){
  STATE.settingsOpen=false; STATE.exportOpen=false;
  STATE.editingOpen=false; STATE.cameraOpen=false; STATE.ymOpen=false;
  STATE.logoPending=null;              /* an unapplied logo preview never leaks out */
  stopCapture(); STATE.confirmBox=null; render();
}
function attachShellEvents(){
  const on=(id,fn)=>{ const el=$(id); if(el) el.onclick=fn; };
  on('btnMenu',()=>{ STATE.drawerOpen=!STATE.drawerOpen; render(); });

  /* --- topbar search --- */
  const si=$('searchInput');
  if(si) si.oninput=()=>{
    STATE.searchQuery=si.value;
    const pos=si.selectionStart;
    render();
    const el=$('searchInput'); if(el){ el.focus(); try{el.setSelectionRange(pos,pos);}catch(e){} }
  };

  /* --- roster controls --- */
  const rs=$('rosterSearch');
  if(rs) rs.oninput=()=>{
    STATE.rosterQuery=rs.value; const pos=rs.selectionStart; render();
    const el=$('rosterSearch'); if(el){ el.focus(); try{el.setSelectionRange(pos,pos);}catch(e){} }
  };
  on('rosterFilter',null); const rf=$('rosterFilter'); if(rf) rf.onchange=()=>{ STATE.rosterFilter=rf.value; render(); };
  const rt=$('rosterSort'); if(rt) rt.onchange=()=>{ STATE.rosterSort=rt.value; render(); };
  const rd=$('rosterDate'); if(rd) rd.onchange=()=>{ if(rd.value){ STATE.calSel=rd.value; render(); } };

  /* --- attendance filters --- */
  const as=$('attSearch');
  if(as) as.oninput=()=>{ STATE.attQuery=as.value; const pos=as.selectionStart; render();
    const el=$('attSearch'); if(el){ el.focus(); try{el.setSelectionRange(pos,pos);}catch(e){} } };
  const af=$('attFrom'); if(af) af.onchange=()=>{ STATE.attFrom=af.value; render(); };
  const at=$('attTo'); if(at) at.onchange=()=>{ STATE.attTo=at.value; render(); };
  const aseg=$('attSection'); if(aseg) aseg.onchange=()=>{ STATE.attSection=aseg.value; render(); };
  const ast=$('attStatus'); if(ast) ast.onchange=()=>{ STATE.attStatus=ast.value; render(); };

  /* --- independent graph sliders (student profile) ---
     each slider updates ONLY its own chart + label (no full re-render,
     so dragging stays smooth and the two graphs never affect each other) */
  const gsl=$('attSlider');
  if(gsl) gsl.oninput=()=>{
    STATE.attSlider=+gsl.value;
    const lb=$('attRange'); if(lb) lb.textContent=attRangeLabel();
    initPageCharts();
  };
  const gsb=$('bmiSlider');
  if(gsb) gsb.oninput=()=>{
    STATE.bmiSlider=+gsb.value;
    const lb=$('bmiRange'); if(lb) lb.textContent=bmiRangeLabel();
    initPageCharts();
  };

  /* --- export filters --- */
  const ef=$('expFrom'); if(ef) ef.onchange=()=>{ STATE.exportFrom=ef.value; refreshPreview(); };
  const et=$('expTo'); if(et) et.onchange=()=>{ STATE.exportTo=et.value; refreshPreview(); };
  const eg=$('expGrade'); if(eg) eg.onchange=()=>{ STATE.exportGrade=eg.value; STATE.exportSection=''; refreshPreview(); };
  const es=$('expSection'); if(es) es.onchange=()=>{ STATE.exportSection=es.value; refreshPreview(); };
  const ea=$('expAdviser'); if(ea) ea.onchange=()=>{ STATE.exportAdviser=ea.value; refreshPreview(); };
  const est=$('expStatus'); if(est) est.onchange=()=>{ STATE.exportAttStatus=est.value; refreshPreview(); };

  /* --- student editor form: live BMI preview + photo + units --- */
  ['fHeight','fWeight','fAge','fSex'].forEach(id=>{
    const el=$(id); if(el) el.oninput=()=>updateBmiPreview();
  });
  const hu=$('fHeightUnit');
  if(hu) hu.onchange=()=>{ convertEditorUnits('height',hu.value); };
  const wu=$('fWeightUnit');
  if(wu) wu.onchange=()=>{ convertEditorUnits('weight',wu.value); };
  const pf=$('photoFile');
  if(pf) pf.onchange=()=>{
    const f=pf.files&&pf.files[0]; if(!f) return;
    resizeImage(f,420,.82,url=>{ STATE.editingPhoto=url; render(); toast('ok','Photo added','The photo will be saved with the record.'); });
  };
  /* --- Settings: replace the background logo.
         Round 4 §3 — the file is NOT applied straight away: it is held as a
         preview (STATE.logoPending) so the user can see it first, then press
         "Use this logo" / "Apply & save" to make it live. --- */
  const lf=$('logoFile');
  if(lf) lf.onchange=()=>{
    const f=lf.files&&lf.files[0]; if(!f) return;
    resizeImage(f,900,.85,url=>{
      lf.value='';                       /* allow re-selecting the same file */
      STATE.logoPending=url;
      render();
      toast('ok','Logo ready to preview','Check the preview below, then press “Use this logo” to apply it.');
    });
  };
  /* --- Settings: decoration opacity (live preview, saved on Apply) --- */
  const bo=$('bgOpacity');
  if(bo) bo.oninput=()=>{
    SETTINGS.bgOpacity=(+bo.value)/100;
    const lab=$('bgOpacityVal'); if(lab) lab.textContent=Math.round(SETTINGS.bgOpacity*100)+'%';
    applySettings();
  };
  /* --- backup restore (Settings → Restore from backup) --- */
  const rst=$('restoreFile');
  if(rst) rst.onchange=()=>{
    const f=rst.files&&rst.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{ restoreBackup(String(rd.result||'')); rst.value=''; };
    rd.onerror=()=>{ toast('err','Restore failed','The backup file could not be read.'); rst.value=''; };
    rd.readAsText(f);
  };
  ['appBg','appBgDark','sideBg','sideBgDark'].forEach(k=>{
    document.querySelectorAll('[data-custom-'+k+']').forEach(el=>{
      el.oninput=()=>{ SETTINGS[k]=el.value; applySettings(); persist(); };
    });
  });

  /* --- scanner --- */
  on('btnCamStart',startScanner);
  on('btnCamStop',stopScanner);
  on('btnManualScan',()=>{ const el=$('manualId'); if(el) handleScan(el.value.trim(),'manual'); });
  const mi=$('manualId');
  if(mi) mi.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); handleScan(mi.value.trim(),'manual'); } };

  /* --- keyboard --- */
  document.onkeydown=e=>{
    if(e.key==='Escape'){
      if(STATE.confirmBox||STATE.editingOpen||STATE.cameraOpen||STATE.settingsOpen||STATE.exportOpen||STATE.ymOpen){ closeModals(); }
      else if(STATE.searchQuery){ STATE.searchQuery=''; render(); }
    }
  };
}
/* SHOW / HIDE password buttons (login, account, settings) */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-pw]');
  if(!b) return;
  const inp=$(b.getAttribute('data-pw')); if(!inp) return;
  const show=inp.type==='password';
  inp.type=show?'text':'password';
  b.textContent=show?'HIDE':'SHOW';
  b.setAttribute('aria-label',show?'Hide password':'Show password');
});
function refreshPreview(){

function updateBmiPreview(){
  /* canonical cm / kg always drive the maths — the unit selectors only
     change how the number is displayed or typed */
  const hEl=$('fHeight'), wEl=$('fWeight');
  const hCm=hEl?heightFromInput(hEl.value,STATE.editingHeightUnit):(STATE.editingHeightCm||null);
  const wKg=wEl?weightFromInput(wEl.value,STATE.editingWeightUnit):(STATE.editingWeightKg||null);

  const age=$('fAge')?+$('fAge').value:null;
  const sex=$('fSex')?$('fSex').value:'Male';

  STATE.editingBmiPreview={bmi,cls:bmi?assessBMI(sex,age,bmi):null};
  const box=$('bmiPreviewBox');
  if(box){
    const minor=(age!=null&&age>=5&&age<=19);
    box.innerHTML=`${icon('flask')} BMI: <b>${bmi?esc(bmi):'—'}</b>

        BMI = weight (kg) ÷ height (m)², converted from ${esc(STATE.editingHeightUnit)} / ${esc(STATE.editingWeightUnit)} automatically ·
        ${esc(bmiReferenceFor(sex,age))}.

      </div>`;

}
/* switching cm↔ft or kg↔lbs re-displays the SAME measurement — the
   stored value never changes just because the unit changed */
function convertEditorUnits(kind,unit){
  STATE.editingUnitToggled=true;
  if(kind==='height'){
    STATE.editingHeightUnit=(unit==='ft')?'ft':'cm';
    const el=$('fHeight');
    if(el){
      el.value=(STATE.editingHeightCm==null||STATE.editingHeightCm==='')?'':heightToDisplay(STATE.editingHeightCm,STATE.editingHeightUnit);

      el.setAttribute('placeholder',STATE.editingHeightUnit==='ft'?'e.g. 5.7':'e.g. 170');
    }
  }else{
    STATE.editingWeightUnit=(unit==='lbs')?'lbs':'kg';
    const el=$('fWeight');
    if(el){
      el.value=(STATE.editingWeightKg==null||STATE.editingWeightKg==='')?'':weightToDisplay(STATE.editingWeightKg,STATE.editingWeightUnit);

      el.setAttribute('placeholder',STATE.editingWeightUnit==='lbs'?'e.g. 132':'e.g. 60');

}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-view],[data-grade],[data-grade-open],[data-section],[data-open-profile],[data-open-id],[data-student-tab],[data-edit-student],[data-add-student],[data-cal],[data-cal-nav],[data-act],[data-export-type],[data-set-theme],[data-set-accent],[data-set-app-bg],[data-set-side-bg],[data-set-bg],[data-remove-student],[data-confirm-key],[data-ym-month],[data-ym-year]');
  if(!t) return;
  const d=t.dataset;

  /* navigation */
  if(d.view){
    STATE.view=d.view; STATE.studentId=null; STATE.searchQuery=''; STATE.drawerOpen=false;
    if(d.view==='account'){ STATE.accountMsg=''; STATE.accountErr=''; loadAccount(); }
    render(); window.scrollTo({top:0}); return;
  }
  if(d.grade){
    const g=+d.grade;
    STATE.gradeOpen[g]=!STATE.gradeOpen[g];
    STATE.view='students'; STATE.studentId=null;
    if(!STATE.gradeOpen[g]&&STATE.sectionKey&&secOf(STATE.sectionKey)&&secOf(STATE.sectionKey).grade===g) STATE.sectionKey=null;
    render(); return;
  }
  if(d.gradeOpen){
    const g=+d.gradeOpen;
    /* clicking the OPEN grade closes it (back to the full summary);
       clicking the other grade switches the highlight to it */
    const wasOpen=!!STATE.gradeOpen[g];
    STATE.gradeOpen[11]=(g===11)&&!wasOpen;
    STATE.gradeOpen[12]=(g===12)&&!wasOpen;
    STATE.view='students'; STATE.studentId=null; STATE.sectionKey=null;
    STATE.drawerOpen=false;
    render(); window.scrollTo({top:0}); return;
  }
  if(d.section){
    const sec=secOf(d.section); if(!sec) return;
    STATE.sectionKey=d.section; STATE.view='students'; STATE.studentId=null;
    STATE.gradeOpen[sec.grade]=true; STATE.rosterQuery=''; STATE.rosterFilter='all';
    STATE.drawerOpen=false;
    render(); window.scrollTo({top:0}); return;
  }
  if(d.openProfile){ openStudent(d.openProfile,'profile'); return; }
  if(d.openId){ openStudent(d.openId,'id'); return; }
  if(d.studentTab){ STATE.studentTab=d.studentTab; render(); return; }
  if(d.editStudent){ openEditor(d.editStudent); return; }
  if(d.addStudent){ openEditor(null,d.addStudent); return; }

  /* calendar */
  if(d.cal){ STATE.calSel=d.cal; render(); return; }
  if(d.calNav!=null){
    const n=+d.calNav;
    if(n===0){ const now=new Date(); STATE.calY=now.getFullYear(); STATE.calM=now.getMonth(); STATE.calSel=todayKey(); }
    else{ let m=STATE.calM+n, y=STATE.calY; if(m<0){m=11;y--;} if(m>11){m=0;y++;} STATE.calY=y; STATE.calM=m; }
    STATE.ymY=STATE.calY; STATE.ymM=STATE.calM;
    render(); return;
  }

  /* month / year picker overlay (image 2) — the choice applies at once */
  if(d.ymMonth!=null){
    STATE.ymM=+d.ymMonth;
    syncPickerToCalendar();
    render(); scrollYmToSelection(); return;
  }
  if(d.ymYear!=null){
    STATE.ymY=+d.ymYear;
    syncPickerToCalendar();
    render(); scrollYmToSelection(); return;
  }

  /* (the workbook is always the same 3 sheets — no type picker) */

  /* theme / backgrounds — each theme stores its own colour */
  if(d.setTheme){ SETTINGS.theme=d.setTheme; applySettings(); persist(); render(); return; }
  if(d.setAccent){
    if(!ACCENTS[d.setAccent]) return;
    SETTINGS.accent=d.setAccent; applySettings(); persist(); render();
    toast('ok','Theme colour changed',ACCENTS[d.setAccent].label+' is now applied across the website.');
    return;
  }
  if(d.setAppBg){ SETTINGS[SETTINGS.theme==='dark'?'appBgDark':'appBg']=d.setAppBg; applySettings(); persist(); render(); return; }
  if(d.setSideBg){ SETTINGS[SETTINGS.theme==='dark'?'sideBgDark':'sideBg']=d.setSideBg; applySettings(); persist(); render(); return; }
  if(d.setBg){ SETTINGS.bg=d.setBg; applySettings(); persist(); render(); return; }

  /* actions */
  switch(d.act){
    case 'set-theme': /* Light / Dark switches emit data-act="set-theme" + data-theme */
      SETTINGS.theme=(d.theme==='dark')?'dark':'light';
      applySettings(); persist(); render(); return;
    case 'open-settings': STATE.settingsOpen=true; STATE.drawerOpen=false; render(); return;
    case 'open-export': STATE.exportOpen=true; STATE.drawerOpen=false; render(); return;
    case 'go-grades': /* top bar "Grade & Section": straight to the folders */
      STATE.view='students'; STATE.studentId=null; STATE.sectionKey=null;
      STATE.gradeOpen[11]=false; STATE.gradeOpen[12]=false;
      STATE.drawerOpen=false; STATE.searchQuery='';
      render(); window.scrollTo({top:0}); return;
    case 'all-sections': /* SUMMARY (ALL) bar: opens the full roster of every student */
      STATE.view='students'; STATE.studentId=null; STATE.drawerOpen=false;
      STATE.gradeOpen[11]=false; STATE.gradeOpen[12]=false;
      STATE.sectionKey='ALL';
      STATE.rosterQuery=''; STATE.rosterFilter='all';
      render(); window.scrollTo({top:0}); return;
    case 'close-modal': closeModals(); return;
    case 'close-scrim': STATE.drawerOpen=false; render(); return;
    case 'go-attendance': STATE.view='attendance'; STATE.studentId=null; render(); return;
    case 'logout': logout(); return;
    case 'account': STATE.view='account'; STATE.accountMsg=''; STATE.accountErr=''; loadAccount(); render(); return;
    case 'save-account': saveAccount(); return;
    case 'change-password': changePassword(); return;
    case 'open-ym': STATE.ymOpen=true; STATE.ymY=STATE.calY; STATE.ymM=STATE.calM; render(); scrollYmToSelection(); return;
    case 'close-ym': STATE.ymOpen=false; render(); return;
    case 'reset-theme':
      STATE.confirmBox={title:'Restore default appearance?',
        html:'Reset the theme, colours, background logo and opacity back to the CDLSHS defaults. Student records, attendance and measurements are not affected.',
        yes:'Restore defaults',onYes:()=>{
          SETTINGS=Object.assign({},DEFAULT_SETTINGS); applySettings(); persistNow(); render();
          toast('ok','Defaults restored','Theme, colours, logo and opacity are back to the CDLSHS defaults.');
        }};
      render(); return;
    case 'save-settings':
      /* a previewed logo is only committed here (or via "Use this logo") */
      if(STATE.logoPending){ SETTINGS.logoSrc=STATE.logoPending; STATE.logoPending=null; }
      applySettings(); persistNow(); render();
      toast('ok','Settings saved','Appearance preferences were saved and will remain after refreshing the website.');
      return;
    case 'apply-logo':
      if(!STATE.logoPending) return;
      SETTINGS.logoSrc=STATE.logoPending; STATE.logoPending=null;
      applySettings(); persistNow(); render();
      toast('ok','Logo applied','Your logo now sits behind the page content, keeping its original proportions.');
      return;
    case 'cancel-logo':
      STATE.logoPending=null; render();
      toast('ok','Selection discarded','No change was made — the previous logo is still in use.');
      return;
    case 'restore-logo':
      STATE.logoPending=null;
      SETTINGS.logoSrc=null; applySettings(); persistNow(); render();
      toast('ok','Official logo restored','The CDLSHS logo is used for the page background and navigation.');
      return;
    case 'backup-data': downloadBackup(); return;
    case 'save-student': saveStudent(); return;
    case 'clear-photo': STATE.editingPhoto=null; render(); return;
    case 'open-camera': STATE.cameraOpen=true; render(); startCapture(); return;
    case 'capture-photo': capturePhoto(); return;
    case 'print-card': if(d.id) printId(d.id); return;
    case 'print-test-qr': printTestQR(); return;
    case 'do-export': doExport(); return;
    case 'cancel-confirm': STATE.confirmBox=null; render(); return;
    case 'confirm-yes': {
      const fn=STATE.confirmBox&&STATE.confirmBox.onYes;
      STATE.confirmBox=null;
      if(fn) fn(); else render();
      return;
    }

      const s=STUDENTS[d.id]; if(!s) return;

        message:'Remove '+s.name+' and all attendance history? This cannot be undone.',
        yes:'Remove',danger:true,onYes:()=>removeStudent(d.id)};
      render(); return;
    }
  }
  if(d.removeStudent){
    const s=STUDENTS[d.removeStudent]; if(!s) return;
    STATE.confirmBox={title:'Remove student record?',
      message:'Remove '+s.name+' and all attendance history? This cannot be undone.',

/* =========================================================
   MUTATIONS (p6b) — student records + attendance
   ========================================================= */
function openEditor(id,sectionKey){
  STATE.editingStudentId=id||null;
  STATE.editingSectionKey=sectionKey||(id&&STUDENTS[id]?STUDENTS[id].sectionKey:HOME_SECTION);
  STATE.editingPhoto=id&&STUDENTS[id]?STUDENTS[id].photo:null;
  /* measurement entry units (the record itself always holds cm / kg) */
  const s=id?STUDENTS[id]:null;
  STATE.editingHeightUnit=(s&&s.heightUnit==='ft')?'ft':'cm';
  STATE.editingWeightUnit=(s&&s.weightUnit==='lbs')?'lbs':'kg';
  STATE.editingHeightCm=s?(s.height||null):null;
  STATE.editingWeightKg=s?(s.weight||null):null;
  /* the measurement as it was when the editor opened — used to make sure a
     cm↔ft / kg↔lbs display switch alone can never change the record */
  STATE.editingOrigHeightCm=STATE.editingHeightCm;
  STATE.editingOrigWeightKg=STATE.editingWeightKg;
  STATE.editingUnitToggled=false;
  STATE.editingDraft=null; STATE.editingBmiPreview=null;
  STATE.editingOpen=true;
  render();
  updateBmiPreview();
}
function telOk(v){
  if(!v) return true; /* blank allowed — never invent data */
  const digits=String(v).replace(/\D/g,'');
  return digits.length>=7&&digits.length<=15; /* validates format, never rewrites digits */
}
function saveStudent(){
  const id=STATE.editingStudentId;
  const name=($('fName')?$('fName').value:'').trim();
  const err=$('stuErr');
  const fail=m=>{ if(err) err.textContent=m; toast('err','Not saved',m); };
  if(!name) return fail('Full name is required (Last, First M.I.).');
  const ageRaw=$('fAge')?$('fAge').value:'';
  const age=ageRaw===''?null:+ageRaw;
  if(age!=null&&(!(age>=3&&age<=25))) return fail('Age must be between 3 and 25.');
  const sex=$('fSex')?$('fSex').value:'Male';
  const grade=+$('fGrade').value;
  const sectionKey=$('fSection').value;
  const lrn=($('fLrn')?$('fLrn').value:'').trim();
  if(lrn&&!/^\d{6,15}$/.test(lrn)) return fail('LRN must be 6–15 digits, or blank if not provided.');
  const contact=($('fContact')?$('fContact').value:'').trim();
  const parentC=($('fParentC')?$('fParentC').value:'').trim();
  if(!telOk(contact)) return fail('Student contact must be 7–15 digits (digits are never changed).');
  if(!telOk(parentC)) return fail('Parent/guardian contact must be 7–15 digits (digits are never changed).');
  const parentName=($('fParent')?$('fParent').value:'').trim();
  const allergy=($('fAllergy')?$('fAllergy').value:'').trim()||'None';
  /* ---- measurements (Revision Round 3) ----
     No arbitrary height/weight range limits: any properly entered
     measurement is accepted. The entered value is converted to the
     school's standard units (cm / kg) for BMI and storage. */
  const hRaw=$('fHeight')?$('fHeight').value:'';
  const wRaw=$('fWeight')?$('fWeight').value:'';
  const hUnit=$('fHeightUnit')?$('fHeightUnit').value:STATE.editingHeightUnit;
  const wUnit=$('fWeightUnit')?$('fWeightUnit').value:STATE.editingWeightUnit;
  const height=heightFromInput(hRaw,hUnit);
  const weight=weightFromInput(wRaw,wUnit);
  if(hRaw!==''&&height==null) return fail('Enter a height greater than 0, or leave the field blank if the student has not been measured.');
  if(wRaw!==''&&weight==null) return fail('Enter a weight greater than 0, or leave the field blank if the student has not been measured.');
  if(hRaw!==''&&!(height>0)) return fail('The height entered is not a valid measurement.');
  if(wRaw!==''&&!(weight>0)) return fail('The weight entered is not a valid measurement.');
  /* unit round-trip guard: switching cm↔ft or kg↔lbs only re-displays the
     value, so tiny conversion rounding (170 cm → 5.58 ft → 170.1 cm) must
     never overwrite the stored measurement. Applies only when a unit
     selector was toggled during this edit — deliberate typing still saves. */
  const prevCm=STATE.editingOrigHeightCm, prevKg=STATE.editingOrigWeightKg;
  const unitToggled=!!STATE.editingUnitToggled;
  const finalHeight=(unitToggled&&height!=null&&prevCm!=null&&Math.abs(height-prevCm)<=0.2)?prevCm:height;
  const finalWeight=(unitToggled&&weight!=null&&prevKg!=null&&Math.abs(weight-prevKg)<=0.1)?prevKg:weight;
  const measuredAt=$('fMeasuredAt')?$('fMeasuredAt').value:'';

  /* duplicate prevention: same name + section cannot be registered twice */
  const dup=allStudents().find(s=>s.id!==id&&s.name.toLowerCase()===name.toLowerCase()&&s.sectionKey===sectionKey);
  if(dup) return fail('A student named “'+name+'” is already registered in '+secFull({sectionKey})+'.');

  let s;
  if(id){
    s=STUDENTS[id];
    if(!s) return fail('Record no longer exists.');
  }else{
    s=blankStudent({name},sectionKey,grade);
    STUDENTS[s.id]=s;
  }
  /* personal */
  s.name=name; s.sex=sex; s.age=age; s.grade=grade; s.sectionKey=sectionKey; s.lrn=lrn;
  /* photo: keep existing unless the draft changed it */
  if(STATE.editingPhoto!==undefined&&STATE.editingPhoto!==null&&STATE.editingPhoto!==false) s.photo=STATE.editingPhoto;
  else if(STATE.editingPhoto===null) s.photo=null;
  /* school + contacts */
  s.contact=contact; s.parentName=parentName; s.parentContact=parentC;
  /* health */
  s.allergy=allergy;
  /* entry/display units are remembered per student (canonical = cm / kg) */
  s.heightUnit=(hUnit==='ft')?'ft':'cm';
  s.weightUnit=(wUnit==='lbs')?'lbs':'kg';
  const newBmi=(finalHeight&&finalWeight)?bmiFromHW(finalHeight,finalWeight):null;
  const prevHeight=s.height, prevWeight=s.weight, prevBmi=s.bmi, prevAt=s.measuredAt;
  const measurementChanged=(finalHeight!==prevHeight||finalWeight!==prevWeight)&&finalHeight&&finalWeight;
  if(measurementChanged){
    s.height=finalHeight; s.weight=finalWeight; s.bmi=newBmi; s.measuredAt=measuredAt||todayKey();
    /* history entry — every measurement is preserved with the units it
       was entered in; nothing is ever overwritten or deleted */
    const entry={date:s.measuredAt,age:age!=null?age:s.age,height:finalHeight,weight:finalWeight,bmi:newBmi,
                 heightUnit:s.heightUnit,weightUnit:s.weightUnit};
    const last=s.history.length?s.history[s.history.length-1]:null;
    if(last&&last.date===s.measuredAt){
      s.history[s.history.length-1]=entry;   /* same date: keep one row, latest values */
    }else{
      s.history.push(entry);
    }
  }else if(!newBmi&&!finalHeight&&!finalWeight){
    /* measurements cleared — history is NOT deleted */
  }
  persistNow();
  STATE.editingOpen=false; STATE.editingPhoto=undefined; STATE.editingBmiPreview=null;
  if(!STATE.sectionKey) STATE.sectionKey=sectionKey;
  render();
  toast('ok',id?'Record updated':'Student registered',
    esc(s.name)+' saved to '+secFull(s.sectionKey)+'. BMI '+(s.bmi?s.bmi+' · '+statusOf(s).label:'not measured')+'.');
  void prevAt; void prevBmi;
}
function removeStudent(id){
  const s=STUDENTS[id]; if(!s) return;
  delete STUDENTS[id];
  persistNow();
  if(STATE.studentId===id){ STATE.studentId=null; STATE.view='students'; }
  render();
  toast('ok','Record removed',esc(s.name)+' and the student\'s attendance history were removed.');
}

/* =========================================================
   ATTENDANCE — record a real scan (never invented time)
   ========================================================= */
const SCAN_COOLDOWN_MS=60000; /* recent-duplicate hint window */
function parseScanTime(key,timeStr){
  /* "09:53 PM" -> epoch ms on that date (used only to sanity-check
     legacy records; the attendance record itself stores the epoch) */
  const m=String(timeStr||'').match(/(\d{1,2}):(\d{2})\s*([AP])?/i);
  if(!m) return null;
  let hh=+m[1]; const mm=+m[2];
  const pm=m[3]?/[p]/i.test(m[3]):true;
  if(pm&&hh<12) hh+=12;
  if(!pm&&hh===12) hh=0;
  const d=parseDate(key); d.setHours(hh,mm,0,0);
  return d.getTime();
}
function markAttendance(s,method){
  const now=new Date();
  const key=fmtDate(now);
  if(!isFeedingDay(now)){
    return {ok:false,reason:'not-feeding-day',
      msg:'Today is not a feeding day (Mon–Fri). Weekend scans are not recorded and never count as missed.'};
  }
  const prev=s.attendance[key];
  if(prev&&prev.status===A_STATUS.SCANNED){
    /* the same student / same feeding day is already recorded —
       never create a duplicate record and never change the
       original actual scan time */
    const at=prev.at||(s.scans||[]).filter(x=>x.date===key).map(x=>parseScanTime(key,x.time)).filter(v=>v!=null).pop();
    const recent=at!=null&&(now.getTime()-at)<SCAN_COOLDOWN_MS;
    return {ok:false,reason:recent?'duplicate':'already-recorded',
      msg:'Already recorded today at '+prev.time+'.'+(recent?' Duplicate scans never create duplicate attendance.':' Attendance for this feeding day is already saved.')};
  }
  const time=now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  const ts=now.toLocaleString('en-US');
  s.attendance[key]={status:A_STATUS.SCANNED,time,ts,at:now.getTime()};
  s.scans=s.scans||[];
  s.scans.push({date:key,time,method:method||'QR scan'});
  persistNow();
  const firstReach=!s.tenDayAt&&currentStreak(s)>=STREAK_GOAL;
  if(firstReach) s.tenDayAt=key;
  persistNow();
  return {ok:true,student:s,date:key,time,firstReach,ts};
}
function celebrate(){
  const layer=$('confettiLayer'); if(!layer) return;
  const colors=['#15803D','#22C55E','#4ADE80','#F59E0B','#F97316','#2563EB','#EA580C','#FCD34D'];

    const p=document.createElement('i');

}

/* =========================================================
   SCAN HANDLING — identify → verify → record → celebrate
   ========================================================= */
function findStudentByCode(code){
  if(!code) return null;
  const c=String(code).trim().toLowerCase();
  return allStudents().find(s=>s.id.toLowerCase()===c||(s.lrn&&s.lrn.toLowerCase()===c))||null;
}
function handleScan(code,method){
  const box=$('scanResult');
  const show=html=>{ if(box) box.innerHTML=html; };
  const s=findStudentByCode(code);
  if(!s){
    show(`<div class="notfound-card">${icon('alert')}
      <div><b>Student not found</b>
      <div class="hint" style="color:inherit;">The code “${esc(code||'…')}” does not match any registered student. Check the ID card or add the student first.</div></div></div>`);
    toast('err','Scan not recognised','No student matches that code.');
    return;
  }
  const res=markAttendance(s,method==='manual'?'Manual entry':'QR scan');
  const verify=`<div class="found-card">
    <div style="display:flex;gap:12px;align-items:center;">
      ${avatarHTML(s,'lg')}
      <div style="min-width:0;">
        <div style="font-weight:800;font-size:16px;">${esc(s.name)}</div>
        <div class="rc-meta">${esc(secFull(s.sectionKey))} · ${esc(s.id)}</div>
        <div style="margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;">
          <span class="badge ${res.ok?'ok':'warn'}"><i class="dot ${res.ok?'ok':'warn'}"></i>${res.ok?'Scanned · '+esc(res.time):'Not recorded'}</span>
          ${streakHTML(s)}
        </div>

      ? `<div style="margin-top:10px;font-weight:800;color:var(--ok);">${icon('check')} Attendance recorded for ${esc(fmtDateFull(res.date))} at ${esc(res.time)}. You can now scan the next student.</div>`
      : `<div class="hint" style="margin-top:9px;color:var(--warn);">${icon('alert')} ${esc(res.msg)}</div>`}
  </div>`;

}

/* =========================================================
   PHOTO CAPTURE (webcam → data URL)
   ========================================================= */
let capStream=null;
function startCapture(){
  const v=$('capVideo'); if(!v) return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    const e=$('capErr'); if(e) e.textContent='This browser does not expose a camera. Use “Upload photo” instead.';
    return;
  }
  navigator.mediaDevices.getUserMedia({video:{width:{ideal:800},height:{ideal:800},facingMode:'user'}})
    .then(st=>{ capStream=st; v.srcObject=st; v.play();
      const dot=$('capDot'); if(dot) dot.classList.add('live');
      const st2=$('capStatus'); if(st2) st2.textContent='Camera live'; })
    .catch(()=>{ const e=$('capErr'); if(e) e.textContent='Camera unavailable or permission denied. You can upload a photo instead.'; });
}
function capturePhoto(){
  const v=$('capVideo'); if(!v||!v.videoWidth){ toast('err','Camera not ready','Wait for the live preview, then capture.'); return; }
  const c=document.createElement('canvas');
  const side=Math.min(v.videoWidth,v.videoHeight);
  c.width=c.height=420;
  c.getContext('2d').translate(210,0); c.scale(-1,1); /* mirror to match preview */
  c.getContext('2d').drawImage(v,(v.videoWidth-side)/2,(v.videoHeight-side)/2,side,side,0,0,420,420);
  STATE.editingPhoto=c.toDataURL('image/jpeg',.85);
  stopCapture();
  STATE.cameraOpen=false; render();
  toast('ok','Photo captured','It will be saved with the record.');
}
function stopCapture(){
  if(capStream){ capStream.getTracks().forEach(t=>t.stop()); capStream=null; }
}


/* =========================================================
   SCANNER (p6c) — camera + jsQR decode loop
   The QR only carries the student ID; the registered photo is
   shown afterwards for the adviser to verify in person.
   ========================================================= */
let scanStream=null, scanRAF=null, scanCanvas=null, scanCtx=null,
    lastScanText='', lastScanAt=0, lastSeenAt=0, scanBusyUntil=0;
/* SCANNER TIMING — the camera itself is never slowed down; only the
   duplicate-suppression logic uses these windows:
   · SCAN_LOCK_MS      brief processing lock after a scan so the result
                       card (photo + details) can render undisturbed.
   · SAME_QR_ABSENT_MS the same QR must leave the camera view for this
                       long before it counts as a NEW scan — holding one
                       ID card in front of the camera never re-fires, so
                       a student is never told "Already Scanned" just
                       because the code was read twice in one session.
   A DIFFERENT QR code bypasses the lock, so the next student can be
   scanned as soon as the previous result is shown. */
const SCAN_LOCK_MS=1200, SAME_QR_ABSENT_MS=3000;
function initScannerUI(){
  if($('btnCamStart')){ $('btnCamStart').onclick=startScanner; }
  if($('btnCamStop')){ $('btnCamStop').onclick=stopScanner; }
  if(scanStream){
    /* camera already running — a page re-render rebuilt the controls,
       so restore the live state and re-attach the stream seamlessly */
    if($('btnCamStart')) $('btnCamStart').disabled=true;
    if($('btnCamStop')) $('btnCamStop').disabled=false;
    if($('camDot')) $('camDot').classList.add('live');
    if($('camStatus')) $('camStatus').textContent='Camera live — point at a QR code';
    reattachCamera();
  }else if($('camStatus')) $('camStatus').textContent='Camera idle';
}
function reattachCamera(){
  if(!scanStream) return;
  const v=$('scanVideo'); if(!v) return;
  if(v.srcObject!==scanStream){ v.srcObject=scanStream; try{ v.play(); }catch(e){} }
}
function startScanner(){
  const v=$('scanVideo'); if(!v) return;
  const setStatus=(txt,live)=>{ const el=$('camStatus'); if(el) el.textContent=txt; const d=$('camDot'); if(d) d.classList.toggle('live',!!live); };
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    setStatus('Camera not supported by this browser — use manual entry below.',false);
    toast('err','Camera unavailable','This browser does not expose a camera. Use manual ID entry instead.');
    return;
  }
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}}})
    .then(st=>{
      scanStream=st; v.srcObject=st; v.play();
      setStatus('Camera live — point at a QR code',true);
      if($('btnCamStart')) $('btnCamStart').disabled=true;
      if($('btnCamStop')) $('btnCamStop').disabled=false;
      if(!scanCanvas){ scanCanvas=document.createElement('canvas'); scanCtx=scanCanvas.getContext('2d',{willReadFrequently:true}); }
      lastScanText=''; lastScanAt=0; lastSeenAt=0; scanBusyUntil=0;
      const tick=()=>{
        if(!scanStream) return;
        const vid=$('scanVideo');           /* page may re-render; re-read each frame */
        if(vid&&vid.srcObject!==scanStream){ try{ vid.srcObject=scanStream; vid.play(); }catch(e){} }
        const vv=vid||v;
        if(vv&&vv.readyState===vv.HAVE_ENOUGH_DATA&&vv.videoWidth){
          const w=360, h=Math.round(vv.videoHeight*w/vv.videoWidth);
          scanCanvas.width=w; scanCanvas.height=h;
          scanCtx.drawImage(vv,0,0,w,h);
          try{
            const img=scanCtx.getImageData(0,0,w,h);
            if(typeof jsQR!=='undefined'){
              const code=jsQR(img.data,w,h,{inversionAttempts:'dontInvert'});
              const now=Date.now();
              if(code&&code.data){
                const text=code.data.trim();
                if(!text){ /* empty payload — nothing to identify */ }
                else if(text===lastScanText){
                  /* SAME code still in front of the camera: keep it marked as
                     "seen" and never re-fire while it is held in view — this
                     is what stopped the premature "Already Scanned" flash. */
                  lastSeenAt=now;
                }else if(now<scanBusyUntil){
                  /* another QR appeared while the previous result is still
                     being displayed — wait for the lock to release so the
                     student's photo + details are shown first */
                }else{
                  /* a genuinely new code (or the old one left the view long
                     enough to be forgotten) — process it now */
                  lastScanText=text; lastScanAt=now; lastSeenAt=now;
                  setStatus('Code detected',true);
                  handleScan(text,'QR scan');
                  scanBusyUntil=Date.now()+SCAN_LOCK_MS;
                }
              }else{
                /* nothing visible: if the last code has been away long enough,
                   forget it so the SAME student can be re-scanned later as a
                   genuine duplicate (which then correctly shows "Already
                   recorded today") */
                if(lastScanText&&now-lastSeenAt>SAME_QR_ABSENT_MS){
                  lastScanText='';
                }
              }
            }
          }catch(e){ /* frame skipped */ }
        }
        scanRAF=requestAnimationFrame(tick);
      };
      scanRAF=requestAnimationFrame(tick);
    })
    .catch(()=>{
      setStatus('Camera permission denied — use manual entry below.',false);
      toast('err','Camera blocked','Allow camera access in the browser, or enter the student ID manually.');
    });
}
function stopScanner(){
  if(scanRAF){ cancelAnimationFrame(scanRAF); scanRAF=null; }
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; }
  const v=$('scanVideo'); if(v) v.srcObject=null;
  const el=$('camStatus'); if(el) el.textContent='Camera stopped';
  const d=$('camDot'); if(d) d.classList.remove('live');
  if($('btnCamStart')) $('btnCamStart').disabled=false;
  if($('btnCamStop')) $('btnCamStop').disabled=true;
}
window.addEventListener('pagehide',()=>{ stopScanner(); stopCapture(); });

          plugins:{legend:{display:false},

        borderWidth:2.5,tension:.2,fill:true,spanGaps:false,

      if(median.some(v=>v!=null)){
        ds.push({type:'line',label:'WHO median (BMI-for-age)',data:median,borderColor:th.tick,

              label:c=>c.parsed.y==null?null:(c.datasetIndex===0
                ?('BMI '+c.parsed.y+' kg/m²')
                :('WHO median '+c.parsed.y+' kg/m²'))}}},
          scales:{
            y:{beginAtZero:true,
               title:{display:true,text:'BMI (kg/m²)',color:th.orange},
               ticks:{callback:v=>v},grid:{color:th.grid}},
            x:{grid:{display:false},title:{display:true,text:'Measurement date',color:th.tick}}}}

    }
  }

}


/* =========================================================
   XLSX WRITER — real Office Open XML (ZIP + worksheets)
   (hand-rolled: no new dependency, full control over
    freeze panes, autofilters, styles and text-formatted LRN)
   ========================================================= */
const CRC_TABLE=(function(){const t=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++){c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);}t[n]=c>>>0;}return t;})();
function crc32(buf){ let c=0xFFFFFFFF; for(let i=0;i<buf.length;i++){ c=CRC_TABLE[(c^buf[i])&0xFF]^(c>>>8); } return (c^0xFFFFFFFF)>>>0; }
function dosDateTime(d){
  const date=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  const time=((d.getHours()<<11)|(d.getMinutes()<<5)|(Math.floor(d.getSeconds()/2)))&0xFFFF;
  return {date,time};
}
async function zipStore(files){
  const enc=new TextEncoder(), parts=[], central=[]; let offset=0;
  const dt=dosDateTime(new Date());
  for(const f of files){
    const nameB=enc.encode(f.name);
    const data=enc.encode(f.text);
    let method=0, comp=data;
    if(typeof CompressionStream!=='undefined'){
      try{
        const cs=new CompressionStream('deflate-raw');
        const st=new Blob([data]).stream().pipeThrough(cs);
        const buf=new Uint8Array(await new Response(st).arrayBuffer());
        if(buf.length<data.length){ comp=buf; method=8; }
      }catch(e){ comp=data; method=0; }
    }
    const crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true);
    lh.setUint16(8,method,true); lh.setUint16(10,dt.time,true); lh.setUint16(12,dt.date,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,comp.length,true); lh.setUint32(22,data.length,true);
    lh.setUint16(26,nameB.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nameB,comp);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true);
    ch.setUint16(10,method,true); ch.setUint16(12,dt.time,true); ch.setUint16(14,dt.date,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,comp.length,true); ch.setUint32(24,data.length,true);
    ch.setUint16(28,nameB.length,true); ch.setUint16(30,0,true); ch.setUint16(32,0,true);
    ch.setUint16(34,0,true); ch.setUint16(36,0,true); ch.setUint32(38,0,true); ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer),nameB);
    offset+=30+nameB.length+comp.length;
  }
  const cdStart=offset; let cdSize=0;
  central.forEach(p=>{ cdSize+=p.length; });
  const eocd=new DataView(new ArrayBuffer(22));
  eocd.setUint32(0,0x06054b50,true); eocd.setUint16(4,0,true); eocd.setUint16(6,0,true);
  eocd.setUint16(8,files.length,true); eocd.setUint16(10,files.length,true);
  eocd.setUint32(12,cdSize,true); eocd.setUint32(16,cdStart,true); eocd.setUint16(20,0,true);
  return new Blob([...parts,...central,new Uint8Array(eocd.buffer)],
    {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function escXml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,''); }
function colLetter(n){ let s=''; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-m-1)/26; } return s; }
function sheetXml(sheet){
  const rows=sheet.rows.map((row,ri)=>{
    const cells=row.map((cell,ci)=>{
      if(!cell||cell.v==null||cell.v==='') return '';
      const ref=colLetter(ci+1)+(ri+1);
      if(cell.t==='n') return '<c r="'+ref+'" s="'+(cell.style||0)+'"><v>'+cell.v+'</v></c>';
      return '<c r="'+ref+'" s="'+(cell.style||0)+'" t="inlineStr"><is><t xml:space="preserve">'+escXml(cell.v)+'</t></is></c>';
    }).join('');
    return '<row r="'+(ri+1)+'">'+cells+'</row>';
  }).join('');
  const cols=(sheet.cols||[]).map((w,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>').join('');
  let maxCols=sheet.maxCols||0;
  sheet.rows.forEach(r=>{ if(r.length>maxCols) maxCols=r.length; });
  const lastRow=Math.max(1,sheet.rows.length);
  /* the header row (after the title/period block) is frozen + filtered */
  const headerAt=sheet.headerAt||1;
  const autoFilter=sheet.filter&&maxCols?('<autoFilter ref="A'+headerAt+':'+colLetter(maxCols)+lastRow+'"/>'):'';
  const pane='<pane ySplit="'+headerAt+'" topLeftCell="A'+(headerAt+1)+'" activePane="bottomLeft" state="frozen"/>'
    +'<selection pane="bottomLeft" activeCell="A'+(headerAt+1)+'" sqref="A'+(headerAt+1)+'"/>';
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    +'<sheetViews><sheetView workbookViewId="0">'+pane+'</sheetView></sheetViews>'
    +'<sheetFormatPr defaultRowHeight="15"/>'
    +(cols?'<cols>'+cols+'</cols>':'')
    +'<sheetData>'+rows+'</sheetData>'+autoFilter+'</worksheet>';
}
async function buildXlsx(sheets){
  const names=sheets.map(s=>s.name), files=[];
  files.push({name:'[Content_Types].xml',text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    +'<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    +'<Default Extension="xml" ContentType="application/xml"/>'
    +'<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
    +'<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
    +names.map((n,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')
    +'<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>'
    +'<Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>'
    +'</Types>'});
  files.push({name:'_rels/.rels',text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'

  sheets.forEach((s,i)=>files.push({name:'xl/worksheets/sheet'+(i+1)+'.xml',text:sheetXml(s)}));

function dl(blob,filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>{ URL.revokeObjectURL(url); },5000);
}
/* cell helpers */
const T=(v,st)=>({v:(v==null?'':String(v)),t:'s',style:st||0});
const N=(v,st)=>({v:(typeof v==='number'&&isFinite(v)?v:null),t:'n',style:st==null?0:st});
function D(str){ /* YYYY-MM-DD -> Excel date serial rendered as YYYY-MM-DD
     parse the parts with Date.UTC so the serial is exact in every
     timezone (local-time parsing shifted the date by one day east of UTC) */
  const m=String(str||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return {v:'',t:'s',style:0};
  const ms=Date.UTC(+m[1],+m[2]-1,+m[3]);
  if(isNaN(ms)) return {v:'',t:'s',style:0};
  return {v:Math.round((ms/86400000+25569)*100000)/100000,t:'n',style:4};
}
/* streak as of a past feeding date (consecutive feeding days ending that date) */
function streakOn(s,key){
  if(!isScanned(s,key)) return 0;
  let n=0,d=parseDate(key),guard=0;
  while(guard<3000){
    if(isFeedingDay(d)){
      if(isScanned(s,fmtDate(d))) n++; else break;
    }
    d=addDays(d,-1); guard++;
  }
  return n;
}
/* LRN-or-ID text (leading zeros preserved via text style) */
function lrnCell(s){ return s.lrn?s.lrn:s.id; }

/* =========================================================
   REPORT BUILDERS — read-only over the saved records.
   Nothing here writes to the store; missing values stay blank.
   ========================================================= */
function exportPool(){
  let list=allStudents();
  /* guard against any duplicated record (e.g. an old restore that stored
     the same student under two keys): keep only ONE row per student id */
  const seen=Object.create(null);
  list=list.filter(s=>{
    const k=String(s.id||s.name+'|'+s.sectionKey);
    if(seen[k]) return false;
    seen[k]=1; return true;
  });
  if(STATE.exportGrade) list=list.filter(s=>String(s.grade)===String(STATE.exportGrade));
  if(STATE.exportSection) list=list.filter(s=>s.sectionKey===STATE.exportSection);
  if(STATE.exportAdviser) list=list.filter(s=>adviserOf(s)===STATE.exportAdviser);
  return list.slice().sort((a,b)=>a.grade-b.grade||a.sectionKey.localeCompare(b.sectionKey)||a.name.localeCompare(b.name));
}
function exportRange(){
  const from=STATE.exportFrom||feedingDaysUpTo(todayKey())[0]||todayKey();
  const to=STATE.exportTo||todayKey();
  return {from,to};
}
function reportTitleBlock(title,rows){
  const {from,to}=exportRange();
  return [
    [T('CDLSHS FeedTrack — '+title,5)],
    [T('Crecencia Drucila Lopez Senior High School · School Based Feeding Program · Reporting period: '+fmtDateFull(from)+' to '+fmtDateFull(to)+' · Generated: '+new Date().toLocaleString('en-US'),6)],
    [T('')]
  ];
}
/* =========================================================
   SHEET 1 — ATTENDANCE HISTORY
   Daily attendance and historical attendance are COMBINED in
   this single worksheet: one row per student per date of the
   selected reporting period, chronologically oldest -> newest,
   Present (Scanned) and Absent (Not Scanned) both included,
   and never the same student/date twice.
   ========================================================= */
function attendanceHistorySheet(){
  const list=exportPool(); const {from,to}=exportRange();
  const statusFilter=STATE.exportAttStatus||'';
  const feeding=feedingDaysBetween(from,to);
  const feedingSet=Object.create(null); feeding.forEach(k=>feedingSet[k]=1);
  const rows=reportTitleBlock('Attendance History');
  rows.push([T('Daily and historical attendance combined — '+fmtDateFull(from)+' to '+fmtDateFull(to)+' · oldest to newest',6)]);
  rows.push([T('')]);
  rows.push(['No.','Date','Student Name','LRN or Student ID','Grade Level','Section','Attendance Status','Time Recorded'].map(h=>T(h,1)));
  const headerAt=rows.length; /* frozen + filtered from here */
  /* every date of the period: each feeding day carries the full roster,
     and any other date that holds a saved record is kept as well */
  const dates=Object.create(null);
  feeding.forEach(k=>dates[k]=1);
  list.forEach(s=>Object.keys(s.attendance||{}).forEach(k=>{ if(k>=from&&k<=to) dates[k]=1; }));
  /* one row per (student, date) — the export can never duplicate a record */
  const seen=Object.create(null);
  const events=[];
  Object.keys(dates).sort().forEach(k=>{
    list.forEach(s=>{
      const a=(s.attendance||{})[k];
      if(!a && !feedingSet[k]) return;             /* quiet date without records */
      const uniq=String(s.id)+'|'+k;
      if(seen[uniq]) return; seen[uniq]=1;
      const ok=!!a&&a.status===A_STATUS.SCANNED;
      if(statusFilter==='Scanned'&&!ok) return;
      if(statusFilter==='Not Scanned'&&ok) return;
      events.push({k,s,a,ok});
    });
  });
  events.sort((x,y)=>x.k.localeCompare(y.k)||x.s.name.localeCompare(y.s.name)); /* oldest -> newest */
  let n=0;
  events.forEach(ev=>{
    n++;
    const sec=secOf(ev.s.sectionKey);
    const status=ev.a&&ev.a.status?String(ev.a.status):(ev.ok?A_STATUS.SCANNED:'Not Scanned');
    rows.push([
      N(n,0),D(ev.k),T(ev.s.name),T(lrnCell(ev.s),2),T('Grade '+ev.s.grade),T(sec?sec.label:''),
      T(status),ev.ok?T(ev.a.time||''):T('')
    ]);
  });
  if(!n) rows.push([T(''),T(''),T(''),T(''),T(''),T(''),T('No attendance records in this period'),T('')]);
  return {name:'Attendance History',filter:true,headerAt,cols:[6,15,30,20,12,12,18,15],maxCols:8,rows};
}
/* =========================================================
   SHEET 2 — STUDENT PROFILE AND HEALTH PROGRESS (one sheet)
   Section A = student information (one block of columns)
   Section B = health progress (measurement history) — every
   measurement kept, chronological per student, never merged
   into a single "latest" value.
   ========================================================= */
function profileHealthSheet(){
  const list=exportPool();
  const rows=reportTitleBlock('Student Profile and Health Progress');
  rows.push([T('')]);
  /* the two section bands sit directly above the single frozen header row */
  rows.push([
    T('A · Student Information',7),T('',7),T('',7),T('',7),T('',7),T('',7),T('',7),T('',7),T('',7),T('',7),T('',7),T('',7),
    T('B · Health Progress',8),T('',8),T('',8),T('',8),T('',8)
  ]);
  const A=['No.','Student Full Name','LRN or Student ID','Grade Level','Section','Adviser','Age','Gender','Student Contact Number','Parent/Guardian Name','Parent/Guardian Contact Number','Allergies'];
  const B=['Measurement Date','Height (cm)','Weight (kg)','BMI (kg/m²)','BMI-for-Age Classification'];
  const aStyle=9, bStyle=10; /* blue block / orange block headers */
  rows.push(A.map(h=>T(h,aStyle)).concat(B.map(h=>T(h,bStyle))));
  const headerAt=rows.length; /* frozen + filtered from here */
  let n=0, m=0;
  if(!list.length){
    rows.push([T('No students match the selected filters'),T(''),T(''),T(''),T(''),T(''),T(''),T(''),T(''),T(''),T(''),T(''),T(''),T(''),T(''),T(''),T('')]);
  }
  list.forEach((s,idx)=>{
    const sec=secOf(s.sectionKey);
    const Acells=[
      N(idx+1,0),T(s.name),T(lrnCell(s),2),T('Grade '+s.grade),T(sec?sec.label:''),T(adviserOf(s)),
      T(s.age!=null&&s.age!==''?s.age:''),T(s.sex||''),
      T(s.contact||'',2),T(s.parentName||''),T(s.parentContact||'',2),T(s.allergy||'')
    ];
    /* every saved measurement, oldest -> newest, deduplicated by date */
    const seenM=Object.create(null);
    const hist=(s.history||[]).filter(h=>h&&h.date&&!seenM[String(h.date)]&&(seenM[String(h.date)]=1))
      .slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    if(!hist.length){
      n++;
      rows.push(Acells.concat([T(''),T(''),T(''),T(''),T('No measurement recorded yet')]));
      return;
    }
    hist.forEach(h=>{
      n++; m++;
      const cls=h.bmi?assessBMI(s.sex,h.age!=null?h.age:s.age,h.bmi):null;
      rows.push(Acells.concat([
        D(h.date||''),
        h.height?N(+h.height,3):T(''),
        h.weight?N(+h.weight,3):T(''),
        h.bmi?N(+h.bmi,3):T(''),
        T(cls&&cls.dot?cls.label:'')
      ]));
    });
  });
  if(!m && list.length){
    rows.push([T(''),T(''),T(''),T(''),T(''),T(''),T(''),T(''),T(''),T(''),T(''),T(''),
      T('No height or weight measurements recorded yet'),T(''),T(''),T(''),T('')]);
  }
  return {name:'Student Profile & Health',filter:true,headerAt,
    cols:[6,30,20,12,12,28,6,9,22,26,24,22,17,12,12,13,30],maxCols:17,rows};
}
/* =========================================================
   THE WORKBOOK IS ALWAYS EXACTLY TWO WORKSHEETS
   1 · Attendance History       — daily + historical, combined
   2 · Student Profile & Health — profile (A) + measurements (B)
   ========================================================= */
const WORKBOOK_SHEETS=[
  {key:'history', label:'Attendance History',         desc:'Daily + historical attendance combined, oldest to newest, Present and Absent included, no duplicate rows'},
  {key:'profile', label:'Student Profile & Health',   desc:'Section A student information + Section B health measurements, chronological'}
];
function buildReportSheets(){
  return [attendanceHistorySheet(),profileHealthSheet()];
}
function reportFileName(){
  const {to}=exportRange();
  return 'FeedTrack_Attendance_and_Profile_'+to+'.xlsx';
}

/* =========================================================
   PREVIEW (HTML) — sheet names, row counts, first rows
   ========================================================= */
function previewReport(){
  try{
    /* Excel stores dates as serial numbers; the preview shows them as dates */
    const cellText=c=>{
      if(!c||c.v==null||c.v==='') return '';
      if(c.style===4&&typeof c.v==='number'&&isFinite(c.v)){
        const d=new Date((c.v-25569)*86400000);
        if(!isNaN(d)) return d.toISOString().slice(0,10);
      }
      return String(c.v);
    };
    const sheets=buildReportSheets();
    const html=sheets.map(sh=>{
      const headerIdx=(sh.headerAt||1)-1;
      const header=(sh.rows[headerIdx]||[]).map(c=>`<th>${esc(cellText(c))}</th>`).join('');
      const body=sh.rows.slice(headerIdx+1,headerIdx+7).map(r=>`<tr>${(sh.rows[headerIdx]||[]).map((_,ci)=>{
        return `<td>${esc(cellText(r[ci]))}</td>`;}).join('')}</tr>`).join('');
      const dataRows=sh.rows.length-(headerIdx+1);
      return `<div class="prev-sheet"><b>Sheet: ${esc(sh.name)}</b>
        <span class="hint"> · ${dataRows} data row(s)${sh.filter?' · filters + frozen header':' · frozen header'}</span>
        <div class="prev-wrap" style="margin-top:6px;"><table class="data" style="font-size:11.5px;">
          <thead><tr>${header}</tr></thead><tbody>${body||`<tr><td colspan="${(sh.rows[headerIdx]||[]).length||1}" class="hint">No rows match the selected filters.</td></tr>`}</tbody></table></div></div>`;
    }).join('');
    return {html};
  }catch(e){ return {error:e&&e.message?e.message:'unknown error'}; }
}

/* =========================================================
   EXPORT RUNNER — success and failure messages, no data writes
   ========================================================= */
async function doExport(){
  const status=$('exportStatus');
  const set=html=>{ if(status) status.innerHTML=html; };
  const btn=document.querySelector('[data-act="do-export"]');
  try{
    if(btn){ btn.classList.add('is-loading'); btn.disabled=true; }
    set('<span class="hint">Building workbook…</span>');
    await new Promise(r=>setTimeout(r,30));
    const pool=exportPool();
    if(!pool.length){
      set('<span class="badge warn">No students match the selected filters — adjust the grade, section or adviser.</span>');
      toast('warn','Nothing to export','No records match the selected filters.');
      return;
    }
    const sheets=buildReportSheets();
    const blob=await buildXlsx(sheets);
    const fname=reportFileName();
    dl(blob,fname);
    const rowsTotal=sheets.reduce((n,sh)=>n+Math.max(0,sh.rows.length-((sh.headerAt||1))),0);
    set(`<span class="badge ok">${esc(fname)} downloaded · ${sheets.length} sheet(s) · ${rowsTotal} row(s) · ${(blob.size/1024).toFixed(0)} KB</span>`);
    toast('ok','Excel export successful',fname+' — '+sheets.length+' formatted sheet(s).');
  }catch(err){
    console.error('Export failed',err);
    set('<span class="badge bad">Export failed: '+esc(err&&err.message?err.message:'unknown error')+'. The saved records were not changed.</span>');
    toast('err','Export failed',(err&&err.message)?err.message:'Unknown error while building the workbook.');
  }finally{
    if(btn){ btn.classList.remove('is-loading'); btn.disabled=false; }
  }
}

/* =========================================================
   INIT
   ========================================================= */
function init(){
  try{ loadStore(); }catch(e){ console.error('loadStore',e); }
  STATE.drawerOpen=false; /* ☰ menu starts closed; it slides in on demand */
  applySettings();
  /* restore a live session from this browser tab (server-verified);
     if there is no valid token the login screen is shown immediately */
  const kick=async()=>{
    let tok=''; try{ tok=sessionStorage.getItem('feedtrack.token')||''; }catch(e){}
    if(!tok){ render(); return; }        /* no token: login screen right away */
    try{ await validateSession(); }catch(e){ saveToken('',''); }
    render();
  };
  kick();
  window.addEventListener('beforeunload',()=>{ try{ persistNow(); }catch(e){} });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
else init();
